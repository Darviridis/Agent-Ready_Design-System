components:
  tab:
    title: Tab
    anatomy:
      root:
        type: container
      Tab:
        type: text

    props:
      State:
        type: string
        default: Active
        enum:
          - Inactive
          - Active
        nullable: false

      Size:
        type: string
        default: 2xl
        enum:
          - 2xl
          - xl
          - lg
          - md
          - sm
        nullable: false

      Interaction:
        type: string
        default: Default
        enum:
          - Default
          - Hover
        nullable: false

    default:
      layout:
        - root:
            - Tab
      elements:
        root:
          styles:
            cornerRadius: '{semantic.radius.sm}'
            mainAxisAlignment: CENTER
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            itemSpacing: 10
            padding:
              top: '{primitive.spacing.18}'
              bottom: '{primitive.spacing.18}'
              start: '{primitive.spacing.32}'
              end: '{primitive.spacing.32}'
            backgroundColor: '{component.color.action.primary-background}'
        Tab:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.inverse-text}'
            typography:
              fontSize: '{semantic.typography.body.lg.font-size}'
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Medium
              lineHeight: '{semantic.typography.body.lg.line-height}'
          content: Tab

    variants:
      # Inactive + Default
      - configuration:
          State: Inactive
          Interaction: Default
        elements:
          root:
            styles:
              itemSpacing: 0
              backgroundColor: '{component.color.action.tertiary-background}'
          Tab:
            styles:
              textColor: '{semantic.color.text.secondary-text}'

      # Inactive + Hover
      - configuration:
          State: Inactive
          Interaction: Hover
        elements:
          root:
            styles:
              itemSpacing: 0
              backgroundColor: '{component.color.action.tertiary-background-hover}'
          Tab:
            styles:
              textColor: '{semantic.color.text.secondary-text}'

      # Active + Default
      - configuration:
          State: Active
          Interaction: Default
        elements:
          root:
            styles:
              backgroundColor: '{component.color.action.primary-background}'
          Tab:
            styles:
              textColor: '{semantic.color.text.inverse-text}'

      # Active + Hover
      - configuration:
          State: Active
          Interaction: Hover
        elements:
          root:
            styles:
              backgroundColor: '{component.color.action.primary-background-hover}'
          Tab:
            styles:
              textColor: '{semantic.color.text.inverse-text}'

      # Size: xl
      - configuration:
          Size: xl
        elements:
          root:
            styles:
              padding:
                top: '{primitive.spacing.14}'
                end: '{primitive.spacing.24}'
                bottom: '{primitive.spacing.14}'
                start: '{primitive.spacing.24}'
          Tab:
            styles:
              typography:
                fontSize: '{semantic.typography.body.md.font-size}'
                fontFamily: '{semantic.typography.font-family.primary}'
                fontStyle: Medium
                lineHeight: '{semantic.typography.body.md.line-height}'
                letterSpacing: '{semantic.typography.letter-spacing.default}'
                textCase: ORIGINAL
                textDecoration: NONE
                paragraphIndent: 0
                paragraphSpacing: 0
                leadingTrim: NONE
                listSpacing: 0
                hangingPunctuation: false
                hangingList: false

      # Size: lg
      - configuration:
          Size: lg
        elements:
          root:
            styles:
              padding:
                top: '{primitive.spacing.12}'
                end: '{primitive.spacing.16}'
                bottom: '{primitive.spacing.12}'
                start: '{primitive.spacing.16}'
          Tab:
            styles:
              typography:
                fontSize: '{semantic.typography.body.md.font-size}'
                fontFamily: '{semantic.typography.font-family.primary}'
                fontStyle: Medium
                lineHeight: '{semantic.typography.body.md.line-height}'
                letterSpacing: '{semantic.typography.letter-spacing.default}'
                textCase: ORIGINAL
                textDecoration: NONE
                paragraphIndent: 0
                paragraphSpacing: 0
                leadingTrim: NONE
                listSpacing: 0
                hangingPunctuation: false
                hangingList: false

      # Size: md
      - configuration:
          Size: md
        elements:
          root:
            styles:
              padding:
                top: '{primitive.spacing.8}'
                end: '{primitive.spacing.16}'
                bottom: '{primitive.spacing.8}'
                start: '{primitive.spacing.16}'
          Tab:
            styles:
              typography:
                fontSize: '{semantic.typography.body.sm.font-size}'
                fontFamily: '{semantic.typography.font-family.primary}'
                fontStyle: Medium
                lineHeight: '{semantic.typography.body.sm.line-height}'
                letterSpacing: '{semantic.typography.letter-spacing.default}'
                textCase: ORIGINAL
                textDecoration: NONE
                paragraphIndent: 0
                paragraphSpacing: 0
                leadingTrim: NONE
                listSpacing: 0
                hangingPunctuation: false
                hangingList: false

      # Size: sm
      - configuration:
          Size: sm
        elements:
          root:
            styles:
              padding:
                top: 5
                end: '{primitive.spacing.16}'
                bottom: 5
                start: '{primitive.spacing.16}'
          Tab:
            styles:
              typography:
                fontSize: '{semantic.typography.body.xs.font-size}'
                fontFamily: '{semantic.typography.font-family.primary}'
                fontStyle: Medium
                lineHeight: '{semantic.typography.body.xs.line-height}'
                letterSpacing: '{semantic.typography.letter-spacing.default}'
                textCase: ORIGINAL
                textDecoration: NONE
                paragraphIndent: 0
                paragraphSpacing: 0
                leadingTrim: NONE
                listSpacing: 0
                hangingPunctuation: false
                hangingList: false

    invalidPropCombinations: []

    metadata:
      author: Mia
      lastUpdated: 2026-10-27
      generator:
        url: https://www.figma.com/community/plugin/1549454283615386215/specs-2-formerly-anova
        version: 1.22.0
        name: Specs 2
        license:
          status: none
          level: FREE
      schema:
        url: https://raw.githubusercontent.com/DirectedEdges/specs/specs-schema@0.35.0/packages/schema/schema/component.schema.json
        version: 0.35.0
        latest: https://raw.githubusercontent.com/DirectedEdges/specs/main/packages/schema/schema/component.schema.json
      source:
        pageId: 8:8835
        nodeId: 12:9659
        nodeType: COMPONENT_SET
      conventions:
        platforms:
          figma:
            naming: NONE
            slotConstraints: false
            inferNumberProps: false
      settings:
        spec:
          format: YAML
          keys: SAFE
          layout: LAYOUT
          tokens: TOKEN
          color: OBJECT
          variantDepth: 9999
          details: LAYERED
          collapsePrimitiveWrapper: false
          promotePrimitives: false
          roles: false
          roleValidation: warn
          invalidVariants: false
          invalidCombinations: true
          emptyVariants: false
          defaultSlotContent: false
          splitComponents: true
          splitConcerns: true
          useSubfolders: true
