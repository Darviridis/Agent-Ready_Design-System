components:
  checkbox:
    title: Checkbox
    anatomy:
      root:
        type: container
      check:
        type: instance
        detectedIn: State=Active
        instanceOf: check
    props:
      State:
        type: string
        default: Default
        enum:
          - Default
          - Hover
          - Active
          - Active-disabled
          - Active-hover
          - Disabled
        nullable: false
    default:
      layout:
        - root
      elements:
        root:
          styles:
            clipsContent: true
            cornerRadius: 8
            width: 24
            height: 24
            strokes: "#35423F"
            strokeWeight: 1
            backgroundColor: "#1F2C2A"
        check:
          styles:
            position: ABSOLUTE
            top: 0
            start: 0
            width: 24
            height: 24
          instanceOf: check
    variants:
      - configuration:
          State: Hover
        elements:
          root:
            styles:
              strokes: "#AAE2C8"
              backgroundColor: "#35423F"
      - configuration:
          State: Active
        layout:
          - root:
              - check
        elements:
          root:
            styles:
              strokes: null
              strokeAlign: null
              strokeWeight: null
              backgroundColor: "#AAE2C8"
      - configuration:
          State: Active-disabled
        layout:
          - root:
              - check
        elements:
          root:
            styles:
              opacity: 0.5
              strokes: null
              strokeAlign: null
              strokeWeight: null
              backgroundColor: "#AAE2C8"
      - configuration:
          State: Active-hover
        layout:
          - root:
              - check
        elements:
          root:
            styles:
              strokes: null
              strokeAlign: null
              strokeWeight: null
              effects:
                shadows:
                  - visible: true
                    offsetX: 0
                    offsetY: 0
                    blur: 4
                    spread: 0
                    color: "#9DFFE8"
              backgroundColor: "#D5FFF5"
      - configuration:
          State: Disabled
        elements:
          root:
            styles:
              backgroundColor: null
