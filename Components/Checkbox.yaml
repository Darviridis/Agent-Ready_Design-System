components:
  checkbox:
    title: Checkbox
    anatomy:
      root:
        type: container
      check:
        type: instance
        detectedIn: State=Active, Interaction=Default
        instanceOf: check
    props:
      State:
        type: string
        default: Default
        enum:
        - Default
        - Active
        - Disabled
        nullable: false
      Interaction:
        type: string
        default: Default
        enum:
        - Default
        - Hover
        nullable: false
    default:
      layout:
      - root
      elements:
        root:
          styles:
            clipsContent: true
            cornerRadius: '{semantic.radius.sm}'
            width: 24
            height: 24
            strokes: '{component.color.action.secondary-background}'
            strokeWeight: 1
            backgroundColor: '{component.color.action.tertiary-background}'
        check:
          styles:
            position: ABSOLUTE
            top: 0
            start: 0
            width: 24
            height: 24
          instanceOf: check
    variants:
    - configuration:
        Interaction: Hover
      elements:
        root:
          styles:
            strokes: '{component.color.action.primary-background}'
            backgroundColor: '{component.color.action.secondary-background}'
    - configuration:
        State: Active
      layout:
      - root:
        - check
      elements:
        root:
          styles:
            strokes: null
            strokeAlign: null
            strokeWeight: null
            backgroundColor: '{component.color.action.primary-background}'
    - configuration:
        State: Disabled
      elements:
        root:
          styles:
            backgroundColor: null
    - configuration:
        State: Active
        Interaction: Hover
      elements:
        root:
          styles:
            effects:
              shadows:
              - visible: true
                offsetX: 0
                offsetY: 0
                blur: 4
                spread: 0
                color: '{semantic.color.effect.glow}'
            backgroundColor: '{component.color.action.primary-background-hover}'
    invalidPropCombinations: []
    metadata:
      author: Mia
      lastUpdated: 2026-10-19 21:23:46.664000+00:00
      generator:
        url: https://www.figma.com/community/plugin/1549454283615386215/specs-2-formerly-anova
        version: 1.22.0
        name: Specs 2
        license:
          status: none
          level: FREE
      schema:
        url: https://raw.githubusercontent.com/DirectedEdges/specs/specs-schema@0.35.0/packages/schema/schema/component.schema.json
        version: 0.35.0
        latest: https://raw.githubusercontent.com/DirectedEdges/specs/main/packages/schema/schema/component.schema.json
      source:
        pageId: 5:5545
        nodeId: 186:525
        nodeType: COMPONENT_SET
      conventions:
        platforms:
          figma:
            naming: NONE
            slotConstraints: false
            inferNumberProps: false
      settings:
        spec:
          format: YAML
          keys: SAFE
          layout: LAYOUT
          tokens: TOKEN
          color: OBJECT
          variantDepth: 9999
          details: LAYERED
          collapsePrimitiveWrapper: false
          promotePrimitives: false
          roles: false
          roleValidation: warn
          invalidVariants: false
