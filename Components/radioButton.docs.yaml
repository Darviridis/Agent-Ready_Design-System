# Semantic documentation for RadioButton
# Keep this file separate from the Specs 2 generated visual specification.

component: RadioButton
title: RadioButton

description: >
  A circular selection control that allows a user to select one option
  from a group of mutually exclusive options. Visual values use design tokens.

purpose:
  - Allow users to select one option from a group.
  - Visually indicate whether an option is selected.
  - Provide visual feedback for hover and disabled states.

rationale:
  why_this_approach: >
    RadioButton exposes a clear selected indicator (inner Frame) and matches
    native radio semantics for mutually exclusive choices. State and Interaction
    are separate so disabled and hover do not collapse into one visual mode.
    Group behavior is intentionally left to the parent form or RadioGroup.
  trade_offs:
    - No built-in label; association must be done externally.
    - Size is fixed at 16px in the source; density variants are not defined.
  alternatives:
    - Use Checkbox when multiple options can be selected independently.
    - Use a Select / dropdown when the option set is long.
    - Use Segmented control or Tabs when the choice also switches visible content.


props:
  State:
    type: string
    required: true
    default: Active
    enum:
      - Active
      - Disabled
      - Default
    description: >
      Controls whether the radio button is selected, disabled, or unselected.

  Interaction:
    type: string
    required: true
    default: Default
    enum:
      - Default
      - Hover
    description: >
      Controls the pointer interaction appearance.

anatomy:
  root:
    type: container
    description: >
      The outer circular element. Defines the radio button size, background,
      border, and interaction appearance.
  Frame:
    type: container
    description: >
      The inner circular indicator. Visible when the radio button is selected.

composition:
  canContain:
    - Frame
  required: []
  optional:
    - Frame
  order: >
    Frame is positioned absolutely inside root (top: 3, start: 3)
    and is only present when State=Active.
  notes: >
    RadioButton is an atomic control. It does not accept arbitrary children
    or labels. Associate an external label via htmlFor / aria-labelledby.
    Group behavior is managed by a parent RadioGroup or form logic.

anti_patterns:
  - Do not place text or labels inside the RadioButton root.
  - Do not nest interactive controls inside RadioButton.
  - Do not show the Frame indicator when State is Default or Disabled.
  - Do not manage group selection logic inside a single RadioButton;
    use a parent group or form state.
  - Do not invent additional visual states unless defined by the design system.
  - Do not hardcode colors or radii; always resolve design tokens.

variants:
  - name: Active
    props:
      State: Active
      Interaction: Default
    description: >
      Selected radio button. Displays the inner indicator.
    styles:
      root:
        width: 16
        height: 16
        cornerRadius: "{semantic.radius.full}"
        backgroundColor: "{component.color.action.tertiary-background-hover}"
        strokes: "{component.color.action.primary-background}"
        strokeWeight: 1.2
        clipsContent: true
      Frame:
        width: 10
        height: 10
        cornerRadius: "{semantic.radius.full}"
        backgroundColor: "{component.color.action.primary-background}"
        position: ABSOLUTE
        top: 3
        start: 3

  - name: Disabled
    props:
      State: Disabled
      Interaction: Default
    description: >
      Disabled radio button. Uses the base appearance with reduced opacity.
    styles:
      root:
        opacity: 0.3

  - name: Default
    props:
      State: Default
      Interaction: Default
    description: >
      Unselected radio button. The inner indicator is not displayed.
    layout:
      - root
    styles:
      root:
        width: 16
        height: 16
        cornerRadius: "{semantic.radius.full}"
        backgroundColor: "{component.color.action.tertiary-background}"
        strokes: "{component.color.action.secondary-background}"
        strokeWeight: 1.2
      Frame:
        visible: false

  - name: Hover
    props:
      State: Active
      Interaction: Hover
    description: >
      Hover appearance for a selected radio button.
    styles:
      root:
        backgroundColor: "{component.color.action.secondary-background-hover}"
        strokes: "{component.color.action.primary-background-hover}"
        effects:
          shadows:
            - visible: true
              offsetX: 0
              offsetY: 0
              blur: 4
              spread: 0
              color: "{semantic.color.effect.glow}"
      Frame:
        backgroundColor: "{component.color.action.primary-background-hover}"

  - name: DefaultHover
    props:
      State: Default
      Interaction: Hover
    description: >
      Hover appearance for an unselected radio button.
    styles:
      root:
        backgroundColor: "{component.color.action.tertiary-background-hover}"
        strokes: "{component.color.action.primary-background}"
        effects: null
      Frame:
        visible: false

combinations:
  - State: Active
    Interaction: Default
  - State: Active
    Interaction: Hover
  - State: Disabled
    Interaction: Default
  - State: Default
    Interaction: Default
  - State: Default
    Interaction: Hover

behavior:
  - When State is Active, display the inner Frame indicator.
  - When State is Default, hide the inner Frame indicator.
  - When State is Disabled, reduce the root opacity to 0.3.
  - When Interaction is Hover, apply the hover styles for the corresponding State.
  - The component is a visual control; selection state and group behavior must be managed by the consuming application.

accessibility:
  role: radio
  requirements:
    - Expose the selected state using aria-checked.
    - Expose disabled state using aria-disabled or the native disabled attribute.
    - Provide an accessible name through an associated label.
    - Support keyboard navigation when used within a radio group.

implementation:
  component: RadioButton
  suggestedFile: RadioButton.tsx
  examplesFile: radioButton.examples.tsx
  notes:
    - Keep the State and Interaction prop values consistent with this specification.
    - Use a native input type="radio" when implementing actual form behavior.
    - Keep the visual Frame indicator separate from the input's accessible state.
    - Disabled controls should not respond to selection or hover interactions.
    - Resolve design tokens at runtime / build time.

design_tokens:
  radius_full: "{semantic.radius.full}"
  primary_background: "{component.color.action.primary-background}"
  primary_background_hover: "{component.color.action.primary-background-hover}"
  secondary_background: "{component.color.action.secondary-background}"
  secondary_background_hover: "{component.color.action.secondary-background-hover}"
  tertiary_background: "{component.color.action.tertiary-background}"
  tertiary_background_hover: "{component.color.action.tertiary-background-hover}"
  glow: "{semantic.color.effect.glow}"
