components:
  switch:
    title: Switch
    anatomy:
      root:
        type: container
      thumb:
        type: container
    props:
      State:
        type: string
        default: Default
        enum:
        - Default
        - Active
        - Disabled
        nullable: false
      Interaction:
        type: string
        default: Default
        enum:
        - Default
        - Hover
        nullable: false
    default:
      layout:
      - root:
        - thumb
      elements:
        root:
          styles:
            cornerRadius: 40
            width: 48
            height: 24
            primaryAxisSizingMode: FIXED
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            strokes: '{semantic.color.border.secondary}'
            strokeWeight: 1
            itemSpacing: 10
            padding: 3
            backgroundColor: '{semantic.color.background.primary-bg}'
        thumb:
          styles:
            clipsContent: true
            cornerRadius: 300
            width: 18
            height: 18
            backgroundColor: '{semantic.color.core.primary}'
    variants:
    - configuration:
        State: Active
      elements:
        root:
          styles:
            mainAxisAlignment: END
            backgroundColor: '{semantic.color.background.secondary-bg}'
    - configuration:
        State: Disabled
      elements:
        thumb:
          styles:
            backgroundColor: '{semantic.color.core.secondary}'
    - configuration:
        State: Active
        Interaction: Hover
      elements:
        root:
          styles:
            effects:
              shadows:
              - visible: true
                offsetX: 0
                offsetY: 0
                blur: 4
                spread: 0
                color: '{semantic.color.effect.glow}'
        thumb:
          styles:
            backgroundColor: '{semantic.color.hover.primary-hover}'
    invalidPropCombinations: []
    metadata:
      author: Mia
      lastUpdated: 2026-10-27 15:59:42.475000+00:00
      generator:
        url: https://www.figma.com/community/plugin/1549454283615386215/specs-2-formerly-anova
        version: 1.25.0
        name: Spectacular
        license:
          status: none
          level: FREE
      schema:
        url: https://raw.githubusercontent.com/DirectedEdges/spectacular/specs-schema@0.38.0/packages/schema/schema/component.schema.json
        version: 0.38.0
        latest: https://raw.githubusercontent.com/DirectedEdges/spectacular/main/packages/schema/schema/component.schema.json
      source:
        pageId: 416:104
        nodeId: 417:2640
        nodeType: COMPONENT_SET
      conventions:
        platforms:
          figma:
            naming: NONE
            slotConstraints: false
            inferNumberProps: false
      settings:
        spec:
          format: YAML
          keys: SAFE
          layout: LAYOUT
          tokens: TOKEN
          color: OBJECT
          variantDepth: 9999
          details: LAYERED
          collapsePrimitiveWrapper: false
          promotePrimitives: false
          roles: false
          roleValidation: warn
          invalidVariants: false
          invalidCombinations: true
          emptyVariants: false
          defaultSlotContent: false
          splitComponents: true
          splitConcerns: true
          useSubfolders: true
