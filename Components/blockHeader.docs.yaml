# Semantic documentation for BlockHeader
# Keep this file separate from the Specs 2 generated visual specification.

component: blockHeader
title: BlockHeader

description: >
  A header component for a content block or section. It can display a
  heading with navigation or action buttons. The buttons are icon-only Button
  instances: a back button (arrow-left) on the left and a close button (close)
  on the right. Visual values use design tokens.

purpose:
  - Identify the current content block or section.
  - Provide a consistent header layout.
  - Optionally provide a back action and a close action.

rationale:
  why_this_approach: >
    BlockHeader provides a consistent section chrome (title + optional back
    and close) without becoming a full application navigation bar. Align=Center
    places a back button and a close button on both sides of a centered title
    for modal-like blocks; Align=Left prioritizes title scanning with a single
    trailing close action. Nested Buttons are constrained to Icon / md so the
    header stays compact and predictable. Each button has a fixed role and a
    fixed icon (arrow-left for back, close for close), so the same action looks
    the same on every screen.
  trade_offs:
    - Center variant always expects two Icon buttons (back and close); asymmetric
      actions need careful visual balancing.
    - Left variant has only the close button; there is no back button in this
      variant.
    - Icons are taken from Assets/Icons. The Button's icon is swappable, but
      BlockHeader fixes which icon each slot uses; using a different icon
      means changing this specification, not just the instance.
    - Fixed design width of 1200 is a source reference, not a hard runtime
      constraint; responsive behavior must be implemented by the consumer.
    - Does not include breadcrumbs, tabs, or secondary nav.
  alternatives:
    - Use a full AppBar / TopNav for global product navigation.
    - Use a plain heading plus standalone Button when the block does not need
      standardized header chrome.
    - Avoid stuffing forms, filters, or long toolbars into BlockHeader.


usage:
  use_when:
    - A content block needs a title and a close action, with an optional back action.
    - A section requires a consistent header across different screens.
  avoid_when:
    - The page requires a full application navigation bar.
    - The heading does not belong to a distinct content block.

props:
  Align:
    type: string
    description: Controls the horizontal alignment and arrangement of the header.
    default: Center
    enum:
      - Center
      - Left
    required: true

composition:
  canContain:
    - BackButton
    - Heading
    - CloseButton
  required:
    - Heading
  optional:
    - BackButton
    - CloseButton
  order: >
    Align=Center → BackButton, Heading, CloseButton
    Align=Left   → Heading, CloseButton
  rules:
    - Heading is always required.
    - Center variant renders two Button instances (BackButton on the left,
      CloseButton on the right).
    - Left variant renders one Button instance (CloseButton) after the Heading.
    - BackButton always shows the arrow-left icon (Instance="arrow-left").
    - CloseButton always shows the close icon (Instance="close"), in both variants.
    - Both buttons are instances of Button configured as Variant="Icon",
      State="Default", Interaction="Default", Size="md".
    - Icons come from Assets/Icons.
  notes: >
    BackButton and CloseButton are two separate slots, not one repeated Button,
    because they have different icons and different actions.
    Prefer a slot-based API in implementation:
      header?: React.ReactNode   // left action (back)
      children: React.ReactNode  // heading content
      footer?: React.ReactNode   // right action (close)
    or explicit props: heading + onBack + onClose.

anti_patterns:
  - Do not place arbitrary content (forms, lists, images) inside BlockHeader.
  - Do not use non-Icon Button variants inside the header.
  - Do not omit the Heading.
  - Do not reverse the order of elements for Align=Center (BackButton must
    come first, CloseButton last, flanking the Heading).
  - Do not show a BackButton in the Left variant.
  - Do not use the close icon for the back action or arrow-left for the close
    action; each slot has its own fixed icon.
  - Do not use icons from outside Assets/Icons in the header buttons.
  - Do not treat BlockHeader as a page-level navigation bar.
  - Do not hardcode colors, spacing, or radii; always resolve design tokens.

variants:
  Align:
    Center:
      description: >
        Displays a back button (arrow-left), a centered heading, and a close
        button (close).
      layout:
        - BackButton
        - Heading
        - CloseButton
      heading_alignment: center

    Left:
      description: >
        Displays the heading aligned to the start, followed by one close
        button (close).
      layout:
        - Heading
        - CloseButton
      heading_alignment: start

anatomy:
  root:
    semantic_role: header
    description: Container for the heading and its associated actions.
  BackButton:
    component: Button
    purpose: Back action. Left side of the header, Center variant only.
    configuration:
      Variant: Icon
      State: Default
      Interaction: Default
      Size: md
      Instance: arrow-left
    icon_source: Assets/Icons
  Heading:
    semantic_role: heading
    default_level: 2
    content: Heading
  CloseButton:
    component: Button
    purpose: Close action. Right side of the header, in both variants.
    configuration:
      Variant: Icon
      State: Default
      Interaction: Default
      Size: md
      Instance: close
    icon_source: Assets/Icons

behavior:
  - The Center variant contains two Button instances according to the source
    specification, BackButton (arrow-left) and CloseButton (close).
  - The Left variant contains one Button instance according to the source
    specification, CloseButton (close).
  - The heading alignment and element arrangement change according to Align.
  - Button actions must be defined by the consuming interface; the visual
    specification alone does not define their behavior.

layout:
  source_width: 1200
  width_behavior: >
    Treat 1200px as the source design width, not necessarily a fixed runtime
    width. The component should adapt to its parent container unless the
    product requirements explicitly require a fixed width.
  direction: horizontal
  item_spacing: "{semantic.spacing.inline.8}"
  padding:
    top: "{primitive.spacing.8}"
    bottom: "{primitive.spacing.8}"
    start: "{primitive.spacing.24}"
    end: "{primitive.spacing.24}"
  corner_radius:
    top_start: "{semantic.radius.xl}"
    top_end: "{semantic.radius.xl}"
    bottom_end: "{semantic.radius.none}"
    bottom_start: "{semantic.radius.none}"
  backgroundColor: "{semantic.color.background.primary-bg}"

typography:
  Heading:
    font_family: "{semantic.typography.font-family.primary}"
    font_style: Bold
    font_size: "{semantic.typography.heading.h4.font-size}"
    line_height: "{semantic.typography.heading.h4.line-height}"
    color: "{semantic.color.text.primary-text}"

accessibility:
  - Use a semantic header element for the component container when appropriate.
  - Represent Heading as a real heading element, with its level determined by the page hierarchy.
  - Give each Button an accessible name that describes its action. The buttons are
    icon-only, so the name is required.
  - BackButton (arrow-left) needs a name such as "Back"; CloseButton (close)
    needs a name such as "Close".
  - Mark the icons themselves as decorative (aria-hidden); the accessible name
    comes from the button.
  - Preserve a visible keyboard focus indicator for interactive buttons.
  - Do not rely on alignment or visual appearance alone to communicate meaning.

implementation:
  - Read this file together with components/blockHeader.yaml.
  - Treat the Specs 2 YAML as the source of truth for visual anatomy, dimensions, and variants.
  - Treat this file as additional semantic and behavioral guidance.
  - Use the existing Button component rather than creating a separate button implementation.
  - Keep the heading and buttons responsive to the available container width.
  - Ensure the Center variant remains visually centered when the left and right button widths differ.
  - Implement actual button actions in the consuming interface (onBack, onClose).
  - Use Align with the values Center and Left; do not use Type or Property 1 for this property.
  - 'Configure BackButton as Button with Variant="Icon", State="Default",
    Interaction="Default", Size="md", Instance="arrow-left".'
  - 'Configure CloseButton as Button with Variant="Icon", State="Default",
    Interaction="Default", Size="md", Instance="close".'
  - Resolve the icons from Assets/Icons through the Button's Instance prop; do not
    hardcode icon markup inside BlockHeader.
  - Render BackButton only for Align=Center; render CloseButton for both values.
  - Resolve design tokens at runtime / build time.
  - Prefer a slot-based or explicit-prop API (heading + actions) over free children.

related_components:
  - Button
  - Assets/Icons   # source of the arrow-left and close icons

design_tokens:
  background: "{semantic.color.background.primary-bg}"
  heading_text: "{semantic.color.text.primary-text}"
  radius_xl: "{semantic.radius.xl}"
  radius_none: "{semantic.radius.none}"
  spacing_inline_8: "{semantic.spacing.inline.8}"
  spacing_8: "{primitive.spacing.8}"
  spacing_24: "{primitive.spacing.24}"
  heading_h4_font_size: "{semantic.typography.heading.h4.font-size}"
  heading_h4_line_height: "{semantic.typography.heading.h4.line-height}"
  font_family_primary: "{semantic.typography.font-family.primary}"
