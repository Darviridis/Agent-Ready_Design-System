# Semantic documentation for BlockHeader
# Keep this file separate from the Specs 2 generated visual specification.

component: blockHeader
title: BlockHeader

description: >
  A header component for a content block or section. It can display a
  heading with navigation or action buttons. Visual values use design tokens.

purpose:
  - Identify the current content block or section.
  - Provide a consistent header layout.
  - Optionally provide an action such as closing the block.

usage:
  use_when:
    - A content block needs a title and optional action button.
    - A section requires a consistent header across different screens.
  avoid_when:
    - The page requires a full application navigation bar.
    - The heading does not belong to a distinct content block.

props:
  Align:
    type: string
    description: Controls the horizontal alignment and arrangement of the header.
    default: Center
    enum:
      - Center
      - Left
    required: true

composition:
  canContain:
    - Button
    - Heading
  required:
    - Heading
  optional:
    - Button
  order: >
    Align=Center → Button, Heading, Button
    Align=Left   → Heading, Button
  rules:
    - Heading is always required.
    - Center variant renders two Button instances (typically both close icons).
    - Left variant renders one Button instance after the Heading.
    - Nested Button must be configured as Variant="Icon", State="Default",
      Size="md", Instance="close" (or equivalent action icon).
  notes: >
    Prefer a slot-based API in implementation:
      header?: React.ReactNode   // left action(s)
      children: React.ReactNode  // heading content
      footer?: React.ReactNode   // right action(s)
    or explicit props: heading + onClose / actions.

anti_patterns:
  - Do not place arbitrary content (forms, lists, images) inside BlockHeader.
  - Do not use non-Icon Button variants inside the header.
  - Do not omit the Heading.
  - Do not reverse the order of elements for Align=Center (Button must
    flank the Heading).
  - Do not treat BlockHeader as a page-level navigation bar.
  - Do not hardcode colors, spacing, or radii; always resolve design tokens.

variants:
  Align:
    Center:
      description: Displays a button, a centered heading, and a button.
      layout:
        - Button
        - Heading
        - Button
      heading_alignment: center

    Left:
      description: Displays the heading aligned to the start, followed by one button.
      layout:
        - Heading
        - Button
      heading_alignment: start

anatomy:
  root:
    semantic_role: header
    description: Container for the heading and its associated actions.
  Heading:
    semantic_role: heading
    default_level: 2
    content: Heading
  Button:
    component: Button
    purpose: Header action, such as closing the block.

behavior:
  - The Center variant contains two Button instances according to the source specification.
  - The Left variant contains one Button instance according to the source specification.
  - The heading alignment and element arrangement change according to Align.
  - Button actions must be defined by the consuming interface; the visual specification alone does not define their behavior.

layout:
  source_width: 1200
  width_behavior: >
    Treat 1200px as the source design width, not necessarily a fixed runtime
    width. The component should adapt to its parent container unless the
    product requirements explicitly require a fixed width.
  direction: horizontal
  item_spacing: "{semantic.spacing.inline.8}"
  padding:
    top: "{primitive.spacing.8}"
    bottom: "{primitive.spacing.8}"
    start: "{primitive.spacing.24}"
    end: "{primitive.spacing.24}"
  corner_radius:
    top_start: "{semantic.radius.xl}"
    top_end: "{semantic.radius.xl}"
    bottom_end: "{semantic.radius.none}"
    bottom_start: "{semantic.radius.none}"
  backgroundColor: "{semantic.color.background.primary-bg}"

typography:
  Heading:
    font_family: "{semantic.typography.font-family.primary}"
    font_style: Bold
    font_size: "{semantic.typography.heading.h4.font-size}"
    line_height: "{semantic.typography.heading.h4.line-height}"
    color: "{semantic.color.text.primary-text}"

accessibility:
  - Use a semantic header element for the component container when appropriate.
  - Represent Heading as a real heading element, with its level determined by the page hierarchy.
  - Give each Button an accessible name that describes its action.
  - Preserve a visible keyboard focus indicator for interactive buttons.
  - Do not rely on alignment or visual appearance alone to communicate meaning.

implementation:
  - Read this file together with components/blockHeader.yaml.
  - Treat the Specs 2 YAML as the source of truth for visual anatomy, dimensions, and variants.
  - Treat this file as additional semantic and behavioral guidance.
  - Use the existing Button component rather than creating a separate button implementation.
  - Keep the heading and buttons responsive to the available container width.
  - Ensure the Center variant remains visually centered when the left and right button widths differ.
  - Implement actual button actions in the consuming interface.
  - Use Align with the values Center and Left; do not use Type or Property 1 for this property.
  - Configure nested Button instances according to the source specification:
      Variant="Icon", State="Default", Size="md", Instance="close".
  - Resolve design tokens at runtime / build time.
  - Prefer a slot-based or explicit-prop API (heading + actions) over free children.

related_components:
  - Button

design_tokens:
  background: "{semantic.color.background.primary-bg}"
  heading_text: "{semantic.color.text.primary-text}"
  radius_xl: "{semantic.radius.xl}"
  radius_none: "{semantic.radius.none}"
  spacing_inline_8: "{semantic.spacing.inline.8}"
  spacing_8: "{primitive.spacing.8}"
  spacing_24: "{primitive.spacing.24}"
  heading_h4_font_size: "{semantic.typography.heading.h4.font-size}"
  heading_h4_line_height: "{semantic.typography.heading.h4.line-height}"
  font_family_primary: "{semantic.typography.font-family.primary}"
