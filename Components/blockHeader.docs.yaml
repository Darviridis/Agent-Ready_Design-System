component: blockHeader

description: >
A header component for a content block or section. It can display a
heading with navigation or action buttons.

purpose:

* Identify the current content block or section.
* Provide a consistent header layout.
* Optionally provide an action such as closing the block.

usage:
use_when:
- A content block needs a title and optional action button.
- A section requires a consistent header across different screens.
avoid_when:
- The page requires a full application navigation bar.
- The heading does not belong to a distinct content block.

props:
Property 1:
type: string
description: Controls the horizontal alignment and arrangement of the header.
default: Center
enum:
- Center
- Left
required: true

variants:
Center:
description: Displays a button, a centered heading, and a button.
layout:
- Button
- Heading
- Button
heading_alignment: center

Left:
description: Displays the heading aligned to the start, followed by one button.
layout:
- Heading
- Button
heading_alignment: start

composition:
root:
semantic_role: header
description: Container for the heading and its associated actions.
Heading:
semantic_role: heading
default_level: 2
content: Heading
Button:
component: Button
purpose: Header action, such as closing the block.

behavior:

* The Center variant contains two Button instances according to the source specification.
* The Left variant contains one Button instance according to the source specification.
* The heading alignment changes according to Property 1.
* Button actions must be defined by the consuming interface; the visual specification alone does not define their behavior.

layout:
source_width: 1200
width_behavior: >
Treat 1200px as the source design width, not necessarily a fixed runtime
width. The component should adapt to its parent container unless the
product requirements explicitly require a fixed width.
direction: horizontal
item_spacing: 8
padding:
top: 6
bottom: 6
start: 24
end: 24
corner_radius:
top_start: 20
top_end: 20
bottom_end: 0
bottom_start: 0

typography:
Heading:
font_family: Chirp
font_style: Bold
font_size: 24
line_height: 28
color: "#D1DEDF"

accessibility:

* Use a semantic header element for the component container when appropriate.
* Represent Heading as a real heading element, with its level determined by the page hierarchy.
* Give each Button an accessible name that describes its action.
* Preserve a visible keyboard focus indicator for interactive buttons.
* Do not rely on alignment or visual appearance alone to communicate meaning.

implementation:

* Read this file together with components/blockHeader.yaml.
* Treat the Specs 2 YAML as the source of truth for visual anatomy, dimensions, and variants.
* Treat this file as additional semantic and behavioral guidance.
* Use the existing Button component rather than creating a separate button implementation.
* Keep the heading and buttons responsive to the available container width.
* Ensure the Center variant remains visually centered when the left and right button widths differ.
* Implement actual button actions in the consuming interface.

related_components:

* Button

design_tokens:
background: "#0B1819"
heading_text: "#D1DEDF"
corner_radius: 20
