---

component: button
title: Button

description: >
A reusable interactive component for triggering actions. Supports Primary,
Secondary, and Icon variants, multiple states, hover interaction, and two sizes.

purpose:

* Trigger actions in the interface.
* Provide consistent interactive controls.
* Communicate button variant and interaction state.
* Indicate loading and waiting states.

props:
State:
type: string
required: false
default: Disabled
enum:
- Default
- Disabled
- Loading
- Waiting
description: Controls the visual and functional state of the button.

Variant:
type: string
required: false
default: Primary
enum:
- Primary
- Secondary
- Icon
description: Defines the button's visual style and content.

Interaction:
type: string
required: false
default: Default
enum:
- Default
- Hover
description: Defines the hover appearance.

Size:
type: string
required: false
default: lg
enum:
- lg
- md
description: Defines the button's size and vertical padding.

Instance:
type: string
required: false
examples:
- icon
description: >
Identifies the icon instance used by the button when applicable.

anatomy:
root:
type: container
description: Main button container.
Connect wallet:
type: text
description: Button label.
loading:
type: instance
instanceOf: loading
description: Loading indicator shown in the Loading state.
waiting:
type: instance
instanceOf: waiting
description: Waiting indicator shown in the Waiting state.
icon:
type: instance
instanceOf: icon
description: Icon shown for the Icon variant.

