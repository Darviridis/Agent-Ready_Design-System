
component: button
title: Button

description: >
  A reusable interactive component for triggering actions. It supports
  Primary, Secondary, and Icon types, five interaction states, and two
  sizes: 60 and 48. Loading and Waiting states can display dedicated
  indicator instances. Icon buttons use the close instance.

purpose:
  - Trigger an action in the interface.
  - Provide consistent interactive controls.
  - Communicate button type, interaction state, and size.
  - Indicate when an action is loading or waiting.

usage:
  use_when:
    - The user needs to trigger an action.
    - The interface needs a primary or secondary action.
    - An icon-only action is appropriate and its purpose is clear.
    - The interface needs to communicate loading or waiting.
  avoid_when:
    - The primary purpose is navigation to another page; use a link.
    - The element is purely informational and does not trigger an action.
    - An icon-only button has no accessible name.
  alternatives:
    - Link
    - Tab

props:
  Type:
    type: string
    description: Controls the button's visual style and content presentation.
    default: Primary
    enum:
      - Primary
      - Secondary
      - Icon
    required: true

  State:
    type: string
    description: Controls the button's visual and interaction state.
    default: Disabled
    enum:
      - Default
      - Hover
      - Disabled
      - Loading
      - Waiting
    required: true

  Size:
    type: string
    description: Controls button dimensions and padding.
    default: "60"
    enum:
      - "60"
      - "48"
    required: true

  Instance:
    type: string
    description: Identifies an optional nested component instance.
    examples:
      - loading
      - waiting
      - close
    required: false

variants:
  Type:
    Primary:
      description: Main action style.
      default_background: "#AAE2C8"
      default_text_color: "#171818"

    Secondary:
      description: Secondary action style.
      default_background: "#465C52"
      default_text_color: "#E8F4F0"

    Icon:
      description: Icon-only button with no standard filled background.
      background: null
      default_instance: close

  State:
    Default:
      description: Normal enabled appearance.

    Disabled:
      description: Disabled appearance.
      background: "#35423F"
      text_color: "#697976"

    Hover:
      description: Pointer hover appearance.

    Loading:
      description: Loading appearance with reduced opacity.
      opacity: 0.5
      indicator_instance: loading

    Waiting:
      description: Waiting appearance with reduced opacity.
      opacity: 0.5
      indicator_instance: waiting

  Size:
    "60":
      description: Large button size.
      root_width: 200
      vertical_padding: 20

    "48":
      description: Compact button size.
      vertical_padding: 14

combinations:
  Primary_Default:
    Type: Primary
    State: Default
    background_color: "#AAE2C8"
    text_color: "#171818"

  Primary_Hover:
    Type: Primary
    State: Hover
    background_color: "#D5FFF5"
    text_color: "#171818"

  Primary_Disabled:
    Type: Primary
    State: Disabled
    background_color: "#35423F"
    text_color: "#697976"

  Primary_Loading:
    Type: Primary
    State: Loading
    background_color: "#AAE2C8"
    opacity: 0.5
    text_color: "#0F0F0F"
    includes:
      - Connect wallet
      - loading

  Primary_Waiting:
    Type: Primary
    State: Waiting
    background_color: "#1F2C2A"
    opacity: 0.5
    includes:
      - waiting

  Secondary_Default:
    Type: Secondary
    State: Default
    background_color: "#465C52"
    text_color: "#E8F4F0"

  Secondary_Hover:
    Type: Secondary
    State: Hover
    background_color: "#738F82"
    text_color: "#E8F4F0"

  Secondary_Loading:
    Type: Secondary
    State: Loading
    background_color: "#465C52"
    text_color: "#E8F4F0"

  Icon_Default:
    Type: Icon
    State: Default
    background: null
    includes:
      - close

  Icon_Hover:
    Type: Icon
    State: Hover
    background: null
    includes:
      - close

composition:
  root:
    semantic_role: button
    description: Main interactive container.
    width: 200
    width_behavior: fixed
    height_behavior: hug
    corner_radius: 12
    direction: horizontal
    main_axis_alignment: center
    cross_axis_alignment: center
    item_spacing: 8
    default_background_color: "#35423F"
    padding:
      horizontal: 24
      vertical: 20

  Connect wallet:
    semantic_role: button_label
    description: Visible text label for the button.
    default_content: Connect wallet
    font_family: Chirp
    font_style: Medium
    font_size: 18
    line_height: 20
    default_text_color: "#697976"

  loading:
    semantic_role: loading_indicator
    instance_of: loading
    width: 24
    height: 24
    description: Nested loading indicator used in specified button variants.

  waiting:
    semantic_role: waiting_indicator
    instance_of: waiting
    width: 24
    height: 24
    description: Nested waiting indicator used in the Waiting variant.

  close:
    semantic_role: icon
    instance_of: close
    width: 24
    height: 24
    description: Close icon used in Icon button variants.

size_overrides:
  "48":
    root:
      vertical_padding: 14

    Loading:
      vertical_padding: 12

    Waiting:
      padding: 20

    Icon:
      width: 48
      height: 48

  "60":
    Icon:
      width: 60
      height: 60

behavior:
  - Type, State, and Size describe separate properties, but not every combination has a defined visual layout.
  - Keep the visible button label configurable rather than hardcoding Connect wallet.
  - Primary is intended for the main action in a context.
  - Secondary is intended for a supporting action.
  - Icon is intended for an icon-only action.
  - Hover changes visual appearance and must not trigger the action by itself.
  - Disabled buttons must not perform their action.
  - Loading and Waiting must reflect real application state rather than being used as decorative variants.
  - Prevent duplicate submissions while an action is loading when appropriate.
  - Restore the appropriate interactive state when the operation completes or fails.
  - Use the loading instance only in combinations defined by the visual specification.
  - Use the waiting instance in the Waiting variant.
  - Use the close instance in Icon variants.
  - The Instance property is optional and must not replace explicit variant behavior.
  - Preserve the specified size-dependent padding and icon dimensions.
  - Do not infer unspecified visual combinations solely from the default styles.

accessibility:
  - Use a semantic button element for actions.
  - Give the button an accessible name that communicates its purpose.
  - For icon-only buttons, provide an accessible name even when no visible text is present.
  - Support keyboard focus and activation.
  - Provide a visible focus indicator distinct from hover styling.
  - Ensure text, background, and focus indicators have sufficient contrast.
  - Implement disabled behavior in the actual control, not only through color or opacity.
  - Expose loading or busy status to assistive technology when appropriate.
  - Ensure loading and waiting indicators do not become redundant accessible content.
  - Preserve predictable focus behavior during asynchronous operations.

implementation:
  - Read this file together with components/button.yaml.
  - Treat the Specs 2 YAML as the source of truth for visual anatomy, styles, and variant-specific layouts.
  - Treat this file as additional semantic, behavioral, and accessibility guidance.
  - Implement the component using a semantic button for actions.
  - Apply Type, State, and Size according to the selected variant.
  - Preserve the explicit visual differences between Primary, Secondary, and Icon.
  - Preserve the nested loading, waiting, and close instances where defined.
  - Use "60" and "48" as Size values; do not substitute M or L.
  - Implement keyboard focus separately because the supplied visual specification does not define a dedicated focus state.
  - Keep actual disabled, loading, and waiting behavior synchronized with application state.
  - Do not invent additional visual states or colors unless they are defined elsewhere in the design system.
  - Do not assume all combinations of Type, State, and Size are supported.

related_components:
  - Link
  - Tab
  - loading
  - waiting
  - close

design_tokens:
  button_default_background: "#35423F"
  button_primary_background: "#AAE2C8"
  button_primary_hover_background: "#D5FFF5"
  button_secondary_background: "#465C52"
  button_secondary_hover_background: "#738F82"
  button_waiting_background: "#1F2C2A"
  button_disabled_text: "#697976"
  button_primary_text: "#171818"
  button_secondary_text: "#E8F4F0"
  button_corner_radius: 12
  button_font_family: Chirp
  button_font_style: Medium
  button_font_size: 18
  button_line_height: 20
```
