component: button
title: Button

description: >
A reusable interactive component for triggering actions. It supports
Primary, Secondary, and Icon variants, five interaction states, and two
sizes: lg and md. Loading and Waiting states can display dedicated
indicator instances. Icon buttons use the icon instance.

purpose:

* Trigger an action in the interface.
* Provide consistent interactive controls.
* Communicate button variant, interaction state, and size.
* Indicate when an action is loading or waiting.

usage:
use_when:
- The user needs to trigger an action.
- The interface needs a primary or secondary action.
- An icon-only action is appropriate and its purpose is clear.
- The interface needs to communicate loading or waiting.
avoid_when:
- The primary purpose is navigation to another page; use a link.
- The element is purely informational and does not trigger an action.
- An icon-only button has no accessible name.
alternatives:
- Link
- Tab

props:
Variant:
type: string
description: Controls the button's visual style and content presentation.
default: Primary
enum:
- Primary
- Secondary
- Icon
required: true

State:
type: string
description: Controls the button's visual and interaction state.
default: Disabled
enum:
- Default
- Hover
- Disabled
- Loading
- Waiting
required: true

Size:
type: string
description: Controls button dimensions and padding.
default: "lg"
enum:
- "lg"
- "md"
required: true

Instance:
type: string
description: Identifies an optional nested component instance.
examples:
- loading
- waiting
- icon
required: false

variants:
