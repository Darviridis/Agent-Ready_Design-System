  text_color: "#697976"

Hover:
  description: Pointer hover appearance.

Loading:
  description: Loading appearance with reduced opacity.
  opacity: 0.5
  indicator_instance: loading

Waiting:
  description: Waiting appearance with reduced opacity.
  opacity: 0.5
  indicator_instance: waiting
```

Size:
"lg":
description: Large button size.
root_width: 200
vertical_padding: 20

```
"md":
  description: Compact button size.
  vertical_padding: 14
```

