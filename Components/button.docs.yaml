composition:
root:
semantic_role: button
description: Main interactive container.
width: 200
width_behavior: fixed
height_behavior: hug
corner_radius: 12
direction: horizontal
main_axis_alignment: center
cross_axis_alignment: center
item_spacing: 8
default_background_color: "#35423F"
padding:
horizontal: 24
vertical: 20

Connect wallet:
semantic_role: button_label
description: Visible text label for the button.
default_content: Connect wallet
font_family: Chirp
font_style: Medium
font_size: 18
line_height: 20
default_text_color: "#697976"

loading:
semantic_role: loading_indicator
instance_of: loading
width: 24
height: 24
description: Nested loading indicator used in specified button variants.

waiting:
semantic_role: waiting_indicator
instance_of: waiting
width: 24
height: 24
description: Nested waiting indicator used in the Waiting variant.

icon:
semantic_role: icon
instance_of: icon
width: 24
height: 24
description: Icon used in Icon button variants.

