behavior:

* Variant, State, and Size describe separate properties, but not every combination has a defined visual layout.
* Keep the visible button label configurable rather than hardcoding Connect wallet.
* Primary is intended for the main action in a context.
* Secondary is intended for a supporting action.
* Icon is intended for an icon-only action.
* Hover changes visual appearance and must not trigger the action by itself.
* Disabled buttons must not perform their action.
* Loading and Waiting must reflect real application state rather than being used as decorative variants.
* Prevent duplicate submissions while an action is loading when appropriate.
* Restore the appropriate interactive state when the operation completes or fails.
* Use the loading instance only in combinations defined by the visual specification.
* Use the waiting instance in the Waiting variant.
* Use the icon instance in Icon variants.
* The Instance property is optional and must not replace explicit variant behavior.
* Preserve the specified size-dependent padding and icon dimensions.
* Do not infer unspecified visual combinations solely from the default styles.

accessibility:

* Use a semantic button element for actions.
* Give the button an accessible name that communicates its purpose.
* For icon-only buttons, provide an accessible name even when no visible text is present.
* Support keyboard focus and activation.
* Provide a visible focus indicator distinct from hover styling.
* Ensure text, background, and focus indicators have sufficient contrast.
* Implement disabled behavior in the actual control, not only through color or opacity.
* Expose loading or busy status to assistive technology when appropriate.
* Ensure loading and waiting indicators do not become redundant accessible content.
* Preserve predictable focus behavior during asynchronous operations.

implementation:

* Read this file together with components/button.yaml.
* Treat the Specs 2 YAML as the source of truth for visual anatomy, styles, and variant-specific layouts.
* Treat this file as additional semantic, behavioral, and accessibility guidance.
* Implement the component using a semantic button for actions.
* Apply Variant, State, and Size according to the selected variant.
* Preserve the explicit visual differences between Primary, Secondary, and Icon.
* Preserve the nested loading, waiting, and icon instances where defined.
* Use "lg" and "md" as Size values; do not substitute M or L.
* Implement keyboard focus separately because the supplied visual specification does not define a dedicated focus state.
* Keep actual disabled, loading, and waiting behavior synchronized with application state.
* Do not invent additional visual states or colors unless they are defined elsewhere in the design system.
* Do not assume all combinations of Variant, State, and Size are supported.

