# Semantic documentation for Button
# Keep this file separate from the Specs 2 generated visual specification.

component: button
title: Button

description: >
  A reusable interactive component for triggering actions. Supports Primary,
  Secondary, and Icon variants, multiple states, hover interaction, and two sizes.
  The icon in the Icon variant is swappable: it can be replaced with any icon
  from the Assets/Icons set. All visual values are expressed via design tokens.

purpose:
  - Trigger actions in the interface.
  - Provide consistent interactive controls.
  - Communicate button variant and interaction state.
  - Indicate loading and waiting states.

rationale:
  why_this_approach: >
    A single Button component with Variant (Primary / Secondary / Icon) and
    explicit async States (Loading / Waiting) keeps action affordances consistent
    across the product. Loading keeps the label visible so users know what is
    in progress; Waiting replaces content with an indicator when the outcome
    is not yet known. Icon variant is reserved for compact header/toolbar actions.
    The icon slot is swappable, so one Icon variant covers every icon-only action
    (close, back, etc.) instead of needing a separate variant per icon.
  trade_offs:
    - Loading and Waiting are separate states; implementers must choose the
      correct one rather than a single "busy" flag.
    - Default prop default is Disabled in the source spec; consumers should
      set State explicitly for interactive buttons.
    - Icon buttons require an accessible name; visual-only icons are insufficient.
      Because the icon can change, the accessible name must change with it.
    - The set of available icons is open and grows with Assets/Icons, so it is
      not listed as a closed enum in this document.
  alternatives:
    - Use Link for pure navigation that does not change application state.
    - Use a dedicated IconButton only if the design system later splits Icon
      out; today Icon is a Variant of Button.
    - Do not use Button for inline text navigation; prefer Link.


props:
  State:
    type: string
    required: true
    default: Default
    enum:
      - Default
      - Disabled
      - Loading
      - Waiting
    description: Controls the visual and functional state of the button.

  Variant:
    type: string
    required: true
    default: Primary
    enum:
      - Primary
      - Secondary
      - Icon
    description: Defines the button's visual style and content.

  Interaction:
    type: string
    required: true
    default: Default
    enum:
      - Default
      - Hover
    description: >
      Defines the hover appearance. For Primary and Secondary it changes the
      background; for Icon it changes only the icon color.

  Size:
    type: string
    required: true
    default: lg
    enum:
      - lg
      - md
    description: Defines the button's size and vertical padding.

  Instance:
    type: string
    required: false
    default: close
    examples:
      - close
      - arrow-left
    source: Assets/Icons
    open: true
    description: >
      Instance swap property for the icon slot. Selects which icon is shown
      when Variant=Icon. The value can be any icon from the Assets/Icons set;
      the examples are not an exhaustive list. New icons added to Assets/Icons
      become valid values automatically, with no change to this specification.
      Default is close.

anatomy:
  root:
    type: container
    description: Main button container.
  Connect wallet:
    type: text
    description: Button label (default content "Connect wallet").
  loading:
    type: instance
    instanceOf: loading
    description: Loading indicator shown in the Loading state.
  waiting:
    type: instance
    instanceOf: waiting
    description: Waiting indicator shown in the Waiting state.
  icon:
    type: instance
    instanceOf: close
    swappable: true
    swapSource: Assets/Icons
    description: >
      Icon slot shown for the Icon variant. Holds close by default and can be
      swapped for any other icon from Assets/Icons via the Instance prop.
      Size (24x24) stays the same regardless of which icon is used.

composition:
  canContain:
    - "Connect wallet"   # text label
    - loading
    - waiting
    - icon               # any icon from Assets/Icons
  required: []
  optional:
    - "Connect wallet"
    - loading
    - waiting
    - icon
  order: >
    Default / Loading (Primary|Secondary): [Connect wallet, loading?]
    Waiting: [waiting] only
    Icon: [icon] only
  rules:
    - State=Default + Variant=Primary|Secondary → text label only
    - State=Loading → text label + loading instance (side by side)
    - State=Waiting → waiting instance only (no text label)
    - Variant=Icon → icon instance only (no text label)
    - The icon slot accepts any icon from Assets/Icons; the default is close.
    - Swapping the icon changes only the glyph; size, padding, and colors of the
      button are unchanged.
  notes: >
    Content is controlled by State + Variant. Do not pass arbitrary children.
    Prefer a label prop or children for the text slot when implementing.
    For the icon slot, accept an icon by name (the Instance prop) and resolve it
    from the Assets/Icons set.

anti_patterns:
  - Do not render loading and waiting instances at the same time.
  - Do not show the text label when State=Waiting.
  - Do not show the text label when Variant=Icon.
  - Do not nest other interactive components inside Button.
  - Do not use Button for pure navigation; prefer Link when the action is navigation-only.
  - Do not hardcode colors, spacing, or radii; always resolve design tokens.
  - Do not hardcode a single icon in the Icon variant; the icon must be swappable.
  - Do not use icons from outside Assets/Icons (custom or one-off SVGs) in the icon slot.
  - Do not reuse one accessible name for different icons; update it when the icon changes.
  - Do not add a background, border, scale, or opacity change to the Icon variant
    on hover; only the icon color changes.

layout:
  root:
    width: 200
    direction: HORIZONTAL
    mainAxisAlignment: CENTER
    crossAxisAlignment: CENTER
    primaryAxisSizingMode: FIXED
    layoutSizingVertical: HUG
    itemSpacing: "{semantic.spacing.inline.8}"
    padding:
      top: "{primitive.spacing.20}"
      bottom: "{primitive.spacing.20}"
      start: "{primitive.spacing.24}"
      end: "{primitive.spacing.24}"
    cornerRadius: "{semantic.radius.md}"
  Connect wallet:
    layoutSizingHorizontal: HUG
    layoutSizingVertical: HUG
    textAlignHorizontal: CENTER
    typography:
      fontSize: "{semantic.typography.body.lg.font-size}"
      fontFamily: "{semantic.typography.font-family.primary}"
      fontStyle: Medium
      lineHeight: "{semantic.typography.body.lg.line-height}"
  loading:
    width: 24
    height: 24
  waiting:
    width: 24
    height: 24
  icon:
    width: 24
    height: 24

variants:
  - name: Primary
    props:
      State: Default
      Variant: Primary
      Interaction: Default
      Size: lg
    description: Primary action button.
    styles:
      root:
        backgroundColor: "{component.color.action.primary-background}"
      Connect wallet:
        textColor: "{semantic.color.text.inverse-text}"

  - name: PrimaryHover
    props:
      State: Default
      Variant: Primary
      Interaction: Hover
    description: Primary button on hover.
    styles:
      root:
        backgroundColor: "{component.color.action.primary-background-hover}"

  - name: Secondary
    props:
      State: Default
      Variant: Secondary
      Interaction: Default
    description: Secondary action button.
    styles:
      root:
        backgroundColor: "{component.color.action.secondary-background}"
      Connect wallet:
        textColor: "{semantic.color.text.primary-text}"

  - name: SecondaryHover
    props:
      State: Default
      Variant: Secondary
      Interaction: Hover
    description: Secondary button on hover.
    styles:
      root:
        backgroundColor: "{component.color.action.secondary-background-hover}"

  - name: Disabled
    props:
      State: Disabled
    description: Disabled button (uses tertiary-hover background).
    styles:
      root:
        backgroundColor: "{component.color.action.tertiary-background-hover}"
      Connect wallet:
        textColor: "{semantic.color.text.tertiary-text}"

  - name: Loading
    props:
      State: Loading
      Variant: Primary
      Size: lg
    description: Button displaying its label and a loading indicator.
    layout:
      - root:
        - Connect wallet
        - loading
    styles:
      root:
        opacity: 0.5
        backgroundColor: "{component.color.action.primary-background}"
        padding:
          top: "{primitive.spacing.18}"
          bottom: "{primitive.spacing.18}"
          end: "{primitive.spacing.20}"
      Connect wallet:
        textColor: "{semantic.color.text.inverse-text}"

  - name: LoadingMedium
    props:
      State: Loading
      Size: md
    description: Medium loading button.
    styles:
      root:
        padding:
          top: "{primitive.spacing.12}"
          bottom: "{primitive.spacing.12}"

  - name: LoadingSecondary
    props:
      State: Loading
      Variant: Secondary
    description: Loading button using the secondary style.
    styles:
      root:
        backgroundColor: "{component.color.action.secondary-background}"
      Connect wallet:
        textColor: "{semantic.color.text.primary-text}"

  - name: Waiting
    props:
      State: Waiting
      Variant: Primary
      Size: lg
    description: Button displaying only the waiting indicator.
    layout:
      - root:
        - waiting
    styles:
      root:
        opacity: 0.5
        padding:
          top: "{primitive.spacing.26}"
          bottom: "{primitive.spacing.26}"
          start: "{primitive.spacing.20}"
          end: "{primitive.spacing.20}"

  - name: WaitingMedium
    props:
      State: Waiting
      Size: md
    description: Medium waiting button.
    styles:
      root:
        padding: "{primitive.spacing.20}"

  - name: Icon
    props:
      State: Default
      Variant: Icon
      Size: lg
    description: >
      Icon-only button. The icon is swappable via the Instance prop
      (any icon from Assets/Icons, default close).
    layout:
      - root:
        - icon
    styles:
      root:
        width: 60
        height: 60
        layoutSizingVertical: FIXED
        backgroundColor: null
        aspectRatio:
          x: 48
          y: 48

  - name: IconMedium
    props:
      State: Default
      Variant: Icon
      Size: md
    description: >
      Medium icon-only button. The icon is swappable via the Instance prop
      (any icon from Assets/Icons, default close).
    styles:
      root:
        width: 48
        height: 48
        padding:
          top: "{primitive.spacing.20}"
          bottom: "{primitive.spacing.20}"
        aspectRatio: null

  - name: IconHover
    props:
      State: Default
      Variant: Icon
      Interaction: Hover
    description: >
      Icon-only button on hover. Only the icon color changes, to the icon hover
      color. Background, size, padding, and radius stay the same. Applies to
      both sizes and to any swapped icon.
    styles:
      icon:
        iconColor: "{component.color.Icon.hover}"

combinations:
  - State: Default
    Variant: Primary
    Interaction: Default
    Size: lg
  - State: Default
    Variant: Primary
    Interaction: Hover
  - State: Default
    Variant: Secondary
    Interaction: Default
  - State: Default
    Variant: Secondary
    Interaction: Hover
  - State: Default
    Variant: Icon
    Interaction: Default
    Size: lg
  - State: Default
    Variant: Icon
    Interaction: Default
    Size: md
  - State: Default
    Variant: Icon
    Interaction: Hover
  - State: Disabled
  - State: Loading
    Variant: Primary
    Size: lg
  - State: Loading
    Size: md
  - State: Loading
    Variant: Secondary
  - State: Waiting
    Variant: Primary
    Size: lg
  - State: Waiting
    Size: md

behavior:
  - State Default displays the button's normal content.
  - State Disabled uses the disabled background and text colors.
  - State Loading displays the label and loading indicator.
  - State Waiting displays only the waiting indicator.
  - Variant Primary uses the primary color palette.
  - Variant Secondary uses the secondary color palette.
  - Variant Icon displays only the icon instance.
  - The icon instance can be swapped for any icon from Assets/Icons (default is close).
  - Swapping the icon does not change the button's size, padding, or colors.
  - Interaction Hover applies the corresponding hover background when defined.
  - For Variant Icon, Interaction Hover changes only the icon color to the icon
    hover color. The button background, size, and shape do not change.
  - The hover icon color applies to whichever icon is in the slot (close,
    arrow-left, or any other icon from Assets/Icons).
  - Size lg and Size md use different vertical padding and icon button dimensions.
  - The consuming application manages click handling and asynchronous action logic.

accessibility:
  requirements:
    - Use a native button element for interactive buttons.
    - Provide an accessible name for every button.
    - Use the disabled attribute when the button cannot be activated.
    - Expose loading or waiting status to assistive technology when applicable.
    - Icon-only buttons require an accessible name.
    - When the icon is swapped, the accessible name must describe the new action
      (for example "Close" for close, "Back" for arrow-left).
    - Mark the icon itself as decorative (aria-hidden) so the accessible name
      comes from the button, not the glyph.
    - The icon-only hover change is subtle (color only). Do not rely on it alone
      to show interactivity; keep a visible keyboard focus indicator.

implementation:
  component: Button
  suggestedFile: Button.tsx
  examplesFile: button.examples.tsx
  notes:
    - Keep Variant, State, Interaction, Size, and Instance consistent with this specification.
    - Preserve the distinction between loading and waiting indicators.
    - Do not display the text label in the Waiting state.
    - The Icon variant uses the icon instance instead of the text label.
    - Accept the icon as a prop (by name or as a component) rather than hardcoding one icon.
    - Resolve the icon from the Assets/Icons set; default to close when none is given.
    - Do not restrict the icon prop to a fixed list; any icon in Assets/Icons is valid.
    - Implement the Icon hover with CSS :hover (and :focus-visible for keyboard
      users) that sets only the icon color to the icon hover token. The icon
      should inherit its color (currentColor) so the change works for any icon.
    - Resolve all design tokens; do not hardcode resolved color or spacing values.
    - Prefer a children or label prop for the text slot when implementing.

related_components:
  - loading
  - waiting
  - icon
  - Assets/Icons   # source of swappable icons

design_tokens:
  radius: "{semantic.radius.md}"
  spacing_inline_8: "{semantic.spacing.inline.8}"
  spacing_20: "{primitive.spacing.20}"
  spacing_24: "{primitive.spacing.24}"
  spacing_18: "{primitive.spacing.18}"
  spacing_12: "{primitive.spacing.12}"
  spacing_26: "{primitive.spacing.26}"
  primary_background: "{component.color.action.primary-background}"
  primary_background_hover: "{component.color.action.primary-background-hover}"
  secondary_background: "{component.color.action.secondary-background}"
  secondary_background_hover: "{component.color.action.secondary-background-hover}"
  tertiary_background: "{component.color.action.tertiary-background}"
  tertiary_background_hover: "{component.color.action.tertiary-background-hover}"
  inverse_text: "{semantic.color.text.inverse-text}"
  primary_text: "{semantic.color.text.primary-text}"
  tertiary_text: "{semantic.color.text.tertiary-text}"
  icon_hover: "{component.color.Icon.hover}"
  body_lg_font_size: "{semantic.typography.body.lg.font-size}"
  body_lg_line_height: "{semantic.typography.body.lg.line-height}"
  font_family_primary: "{semantic.typography.font-family.primary}"
