# Semantic documentation for Input
# Keep this file separate from the Specs 2 generated visual specification.

component: input
title: Input

description: >
  A text input component for entering and displaying user-provided values.
  Supports default, filled, focus, disabled, readonly, warning, and error states.
  Hover feedback exists only for the Default and Filled states. Visual values
  use design tokens.

purpose:
  - Allow users to enter text values.
  - Display a label and input content.
  - Provide visual feedback for focus, disabled, warning, and error states.
  - Provide pointer hover feedback for editable, non-validation states (Default and Filled).
  - Display validation messages when needed.

rationale:
  why_this_approach: >
    Input centralizes text entry with explicit States for empty, filled, focus,
    disabled, readonly, warning, and error. Validation messages are part of the
    component layout so spacing and color stay consistent. Hover is a separate
    Interaction, and it is available only for Default and Filled. States that
    already carry their own strong visual meaning (Focus, Warning, Error) or
    that are not editable (Disabled, Readonly) do not react to hover, so pointer
    feedback never overrides validation borders and glows, the focus ring, or
    the look of a field that cannot be edited.
  trade_offs:
    - Warning and Error both show helper text but different colors/glows;
      product copy must match the severity.
    - Warning and Error do not change on hover. The user gets no pointer
      feedback there, but the validation state stays unambiguous.
    - showErrorText is a boolean flag; more complex multi-message validation
      needs composition outside this component.
    - Caret is a visual affordance for Focus in the design spec; real caret
      comes from the native input in implementation.
  alternatives:
    - Use a Textarea (if introduced) for multi-line content.
    - Use Select / Combobox for constrained option sets.
    - Use Readonly display text (non-input) when the value is never editable
      and should not look like a field.


props:
  State:
    type: string
    required: true
    default: Default
    enum:
      - Default
      - Filled
      - Disabled
      - Focus
      - Readonly
      - Warning
      - Error
    description: >
      Controls the visual and content state of the input.

  Interaction:
    type: string
    required: true
    default: Default
    enum:
      - Default
      - Hover
    description: >
      Controls the hover appearance of the input frame. Hover is valid only
      with State=Default and State=Filled. It is not available for Disabled,
      Focus, Readonly, Warning, or Error.

  showErrorText:
    type: boolean
    required: false
    default: false
    description: >
      Controls whether validation helper text should be displayed.
      The exact visibility behavior should be implemented consistently
      with the selected State.

anatomy:
  root:
    type: container
    description: >
      Vertical wrapper containing the heading, input frame, and helper text.
  Heading:
    type: text
    description: Label displayed above the input.
  Frame 1:
    type: container
    description: >
      Input frame containing the displayed text or caret.
  Text:
    type: text
    description: Placeholder or default input content.
  Entered text:
    type: text
    description: Text displayed in the filled input.
  Caret:
    type: rectangle
    description: Caret displayed in the focused input.
  Error text:
    type: text
    description: Error helper text.
  Please check this value:
    type: text
    description: Warning helper text.
  Enter a valid value:
    type: text
    description: Error validation message.

composition:
  canContain:
    - Heading
    - Frame 1
    - Text            # placeholder inside Frame
    - Entered text    # value inside Frame
    - Caret          # focus indicator inside Frame
    - Error text
    - "Please check this value"
    - "Enter a valid value"
  required:
    - Heading
    - Frame 1
  optional:
    - Text
    - Entered text
    - Caret
    - Error text
    - "Please check this value"
    - "Enter a valid value"
  order: >
    root (vertical):
      1. Heading
      2. Frame 1 (contains Text | Entered text | Caret depending on State)
      3. helper text (Error text | Please check this value | Enter a valid value)
  rules:
    - State=Default → Frame shows Text (placeholder)
    - State=Filled | Readonly | Warning | Error → Frame shows Entered text
    - State=Focus → Frame shows Text + Caret
    - State=Warning → helper = "Please check this value"
    - State=Error → helper = "Enter a valid value"
    - Interaction=Hover is allowed only with State=Default or State=Filled
  notes: >
    Prefer a slot-based or explicit-prop API:
      label?: React.ReactNode
      value / placeholder
      helperText?: React.ReactNode
    Do not accept arbitrary nested interactive components inside the frame.

anti_patterns:
  - Do not nest buttons, links, or other interactive controls inside the input frame.
  - Do not put the helper text above the Heading or between Heading and Frame.
  - Do not show Caret when State is not Focus.
  - Do not show both warning and error helper texts at the same time.
  - Do not invent additional states beyond those defined in the YAML.
  - Do not apply hover styles to Warning or Error. They keep their own border
    and glow while the pointer is over them.
  - Do not apply hover styles to Disabled, Focus, or Readonly.
  - Do not let a generic hover rule override validation or focus styles.
  - Do not hardcode colors, spacing, or radii; always resolve design tokens.

invalid_combinations:
  description: >
    These State and Interaction pairs do not exist. Hover is defined only for
    Default and Filled.
  items:
    - State: Disabled
      Interaction: Hover
    - State: Focus
      Interaction: Hover
    - State: Readonly
      Interaction: Hover
    - State: Warning
      Interaction: Hover
    - State: Error
      Interaction: Hover

layout:
  root:
    width: 420
    direction: VERTICAL
    layoutSizingVertical: HUG
    itemSpacing: "{semantic.spacing.inline.4}"
  Heading:
    layoutSizingHorizontal: FILL
    layoutSizingVertical: HUG
    textColor: "{semantic.color.text.secondary-text}"
    typography:
      fontFamily: "{semantic.typography.font-family.primary}"
      fontStyle: Bold
      lineHeight: "{semantic.typography.body.md.line-height}"
  Frame 1:
    layoutSizingHorizontal: FILL
    layoutSizingVertical: HUG
    direction: HORIZONTAL
    crossAxisAlignment: CENTER
    itemSpacing: 10
    padding:
      top: "{primitive.spacing.14}"
      bottom: "{primitive.spacing.14}"
      start: "{primitive.spacing.20}"
      end: "{primitive.spacing.20}"
    cornerRadius: "{semantic.radius.md}"
    backgroundColor: "{component.color.action.tertiary-background}"
  Text:
    layoutSizingHorizontal: HUG
    layoutSizingVertical: HUG
    textColor: "{semantic.color.text.tertiary-text}"
    typography:
      fontFamily: "{semantic.typography.font-family.primary}"
      fontStyle: Regular
      lineHeight: "{semantic.typography.body.md.line-height}"
  Entered text:
    layoutSizingHorizontal: HUG
    layoutSizingVertical: HUG
    textColor: "{semantic.color.text.primary-text}"
    typography:
      fontFamily: "{semantic.typography.font-family.primary}"
      fontStyle: Regular
      lineHeight: "{semantic.typography.body.md.line-height}"
  Error text:
    visible: false
    textColor: "{semantic.color.text.error-text}"
    typography:
      fontSize: "{semantic.typography.body.xs.font-size}"
      fontFamily: Golos Text
      fontStyle: Regular
      lineHeight: "{semantic.typography.body.sm.line-height}"

variants:
  - name: Default
    props:
      State: Default
      Interaction: Default
    description: >
      Empty input displaying the placeholder text.
    styles:
      Frame 1:
        backgroundColor: "{component.color.action.tertiary-background}"
      Text:
        textColor: "{semantic.color.text.tertiary-text}"

  - name: Hover
    props:
      State: Default
      Interaction: Hover
    description: >
      Default input while hovered. One of only two hover variants (with FilledHover).
    styles:
      Frame 1:
        backgroundColor: "{component.color.action.tertiary-background-hover}"
        strokes: "{component.color.action.secondary-background-hover}"
        strokeAlign: INSIDE
        strokeWeight: 1
        effects:
          shadows:
            - visible: true
              offsetX: 0
              offsetY: 0
              blur: 4
              spread: 0
              color: "{semantic.color.effect.glow}"

  - name: Filled
    props:
      State: Filled
      Interaction: Default
    description: >
      Input displaying entered text.
    layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Error text

  - name: Disabled
    props:
      State: Disabled
      Interaction: Default
    description: >
      Disabled input with a muted heading and reduced frame opacity.
      No hover.
    styles:
      Heading:
        textColor: "{semantic.color.text.tertiary-text}"
      Frame 1:
        opacity: 0.5

  - name: Focus
    props:
      State: Focus
      Interaction: Default
    description: >
      Focused input displaying a caret and highlighted frame. No hover.
    layout:
      - root:
        - Heading
        - Frame 1:
          - Text
          - Caret
        - Error text
    styles:
      Frame 1:
        strokes: "{component.color.action.primary-background}"
        strokeAlign: INSIDE
        strokeWeight: 2
        effects:
          shadows:
            - visible: true
              offsetX: 0
              offsetY: 0
              blur: 4
              spread: 0
              color: "{semantic.color.effect.glow}"
      Caret:
        width: 1
        height: 18
        position: ABSOLUTE
        top: 14
        start: 20
        backgroundColor: "{component.color.action.primary-background}"

  - name: Readonly
    props:
      State: Readonly
      Interaction: Default
    description: >
      Read-only input displaying text without allowing edits. No hover.
    layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Error text
    styles:
      Frame 1:
        strokes: "{component.color.action.tertiary-background-hover}"
        strokeAlign: INSIDE
        strokeWeight: 1
        backgroundColor: "{semantic.color.background.primary-bg}"

  - name: Warning
    props:
      State: Warning
      Interaction: Default
    description: >
      Input displaying a warning validation message. No hover: the warning
      border and glow stay as they are under the pointer.
    layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Please check this value
    styles:
      Frame 1:
        strokes: "{semantic.color.warning.warning}"
        strokeAlign: INSIDE
        strokeWeight: 1
        effects:
          shadows:
            - visible: true
              offsetX: 0
              offsetY: 0
              blur: 4
              spread: 3
              color: "{semantic.color.effect.warning-glow}"
      Please check this value:
        textColor: "{semantic.color.warning.warning}"

  - name: Error
    props:
      State: Error
      Interaction: Default
    description: >
      Input displaying an error validation message. No hover: the error
      border and glow stay as they are under the pointer.
    layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Enter a valid value
    styles:
      Frame 1:
        strokes: "{semantic.color.text.error-text}"
        strokeAlign: INSIDE
        strokeWeight: 1
        effects:
          shadows:
            - visible: true
              offsetX: 0
              offsetY: 0
              blur: 4
              spread: 3
              color: "{semantic.color.effect.error-glow}"
      Enter a valid value:
        textColor: "{semantic.color.text.error-text}"

  - name: FilledHover
    props:
      State: Filled
      Interaction: Hover
    description: >
      Filled input on hover. One of only two hover variants (with Hover).
    styles:
      Frame 1:
        strokes: "{component.color.action.secondary-background}"

combinations:
  - State: Default
    Interaction: Default
  - State: Default
    Interaction: Hover
  - State: Filled
    Interaction: Default
  - State: Filled
    Interaction: Hover
  - State: Disabled
    Interaction: Default
  - State: Focus
    Interaction: Default
  - State: Readonly
    Interaction: Default
  - State: Warning
    Interaction: Default
  - State: Error
    Interaction: Default

behavior:
  - State Default displays the Text placeholder.
  - State Filled displays Entered text.
  - State Disabled applies 0.5 opacity to the input frame and changes the heading color.
  - State Focus displays the caret and highlighted frame.
  - State Readonly displays entered text with a primary background.
  - State Warning displays the warning message "Please check this value."
  - State Error displays the error message "Enter a valid value."
  - Interaction Hover applies the hover styles to the input frame, but only
    for State Default and State Filled.
  - Disabled, Focus, Readonly, Warning, and Error do not change on hover. Their
    appearance is the same with and without the pointer over them.
  - showErrorText controls the visibility of validation helper text in the implementation.
  - The consuming application manages the input value and validation logic.

accessibility:
  role: textbox
  requirements:
    - Associate the heading or label with the input element.
    - Use the native disabled attribute when State is Disabled.
    - Use readOnly when State is Readonly.
    - Expose validation errors to assistive technology.
    - Connect helper text using aria-describedby when applicable.
    - Use aria-invalid for invalid input values when appropriate.
    - Do not rely on hover to communicate meaning. Hover is only a pointer
      affordance for Default and Filled.

implementation:
  component: Input
  suggestedFile: Input.tsx
  examplesFile: input.examples.tsx
  notes:
    - Keep State, Interaction, and showErrorText consistent with this specification.
    - Resolve design tokens at runtime / build time.
    - Do not invent additional states beyond those defined in the YAML.
    - Apply hover styles (CSS :hover) only when State is Default or Filled.
      For example, skip them when the input is disabled, readonly, focused,
      or in the warning or error state.
    - Do not pass Interaction="Hover" together with Disabled, Focus, Readonly,
      Warning, or Error; these combinations are invalid.
    - Prefer explicit props (label, value, placeholder, helperText) over free children.

