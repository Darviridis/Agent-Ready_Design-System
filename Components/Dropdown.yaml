components:
  dropdown:
    title: Dropdown
    anatomy:
      root:
        type: container
      Label:
        type: text
      trigger:
        type: container
      Selected value:
        type: text
      chevron-down:
        type: instance
        instanceOf: chevron-down
      chevron-up:
        type: instance
        detectedIn: State=Open
        instanceOf: chevron-up
      options-list:
        type: container
        detectedIn: State=Open
      Select item:
        type: instance
        detectedIn: State=Open
        instanceOf: Select item
      scrollbar:
        type: container
        detectedIn: State=Open
    props:
      State:
        type: string
        default: Default
        enum:
          - Default
          - Hover
          - Open
          - Disabled
        nullable: false
    default:
      layout:
        - root:
            - Label
            - trigger:
                - Selected value
                - chevron-down
      elements:
        root:
          styles:
            width: 300
            layoutMode: VERTICAL
            layoutSizingVertical: HUG
            itemSpacing: 4
        Label:
          styles:
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            textColor:
              colorSpace: srgb
              components:
                - 0.7608
                - 0.8314
                - 0.8039
              hex: "#C2D4CD"
            typography:
              fontFamily: Chirp
              fontStyle: Bold
              lineHeight: 18
          content: Label
        trigger:
          styles:
            cornerRadius: 8
            mainAxisAlignment: SPACE_BETWEEN
            primaryAxisSizingMode: FIXED
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            itemSpacing: 12
            padding:
              top: 12
              bottom: 12
              start: 16
              end: 12
            backgroundColor:
              colorSpace: srgb
              components:
                - 0.1216
                - 0.1725
                - 0.1647
              hex: "#1F2C2A"
        Selected value:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor:
              colorSpace: srgb
              components:
                - 0.9098
                - 0.9569
                - 0.9412
              hex: "#E8F4F0"
            typography:
              fontFamily: Chirp
              fontStyle: Regular
              lineHeight: 18
          content: Selected value
        chevron-down:
          styles:
            width: 24
            height: 24
          instanceOf: chevron-down
        options-list:
          styles:
            clipsContent: true
            cornerRadius: 12
            width: 300
            layoutMode: VERTICAL
            layoutSizingVertical: HUG
            itemSpacing: 12
            padding:
              top: 15
              bottom: 15
              start: 16
              end: 16
            backgroundColor:
              colorSpace: srgb
              components:
                - 0.1216
                - 0.1725
                - 0.1647
              hex: "#1F2C2A"
        scrollbar:
          styles:
            clipsContent: true
            cornerRadius: 12
            width: 5
            height: 50
            position: ABSOLUTE
            top: 24
            start: 291
            backgroundColor:
              colorSpace: srgb
              components:
                - 0.2078
                - 0.2588
                - 0.2471
              hex: "#35423F"
        chevron-up:
          styles:
            width: 24
            height: 24
          instanceOf: chevron-up
        Select item:
          styles:
            layoutSizingHorizontal: FILL
            height: 48
          propConfigurations:
            State: Default
          instanceOf: Select item
    variants:
      - configuration:
          State: Hover
        elements:
          trigger:
            styles:
              padding:
                end: 8
              backgroundColor:
                colorSpace: srgb
                components:
                  - 0.2078
                  - 0.2588
                  - 0.2471
                hex: "#35423F"
      - configuration:
          State: Open
        layout:
          - root:
              - Label
              - trigger:
                  - Selected value
                  - chevron-up
              - options-list:
                  - Select item
                  - Select item
                  - Select item
                  - Select item
                  - scrollbar
        elements:
