components:
  dropdown:
    title: Dropdown
    anatomy:
      root:
        type: container
      Label:
        type: text
      trigger:
        type: container
      Selected value:
        type: text
      chevron-down:
        type: instance
        instanceOf: chevron-down
      chevron-up:
        type: instance
        detectedIn: State=Open
        instanceOf: chevron-up
      options-list:
        type: container
        detectedIn: State=Open
      SelectItem:
        type: instance
        detectedIn: State=Open
        instanceOf: SelectItem
      scrollbar:
        type: container
        detectedIn: State=Open
    props:
      State:
        type: string
        default: Default
        enum:
        - Default
        - Hover
        - Open
        - Disabled
        nullable: false
    default:
      layout:
      - root:
        - Label
        - trigger:
          - Selected value
          - chevron-down
      elements:
        root:
          styles:
            width: 300
            layoutMode: VERTICAL
            layoutSizingVertical: HUG
            itemSpacing: 4
        Label:
          styles:
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.secondary-text}'
            typography:
              fontFamily: Chirp
              fontStyle: Bold
              lineHeight: 18
          content: Label
        trigger:
          styles:
            cornerRadius: 8
            mainAxisAlignment: SPACE_BETWEEN
            primaryAxisSizingMode: FIXED
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            itemSpacing: 12
            padding:
              top: 12
              bottom: 12
              start: 16
              end: 12
            backgroundColor: '{semantic.color.background.secondary-bg}'
        Selected value:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.primary-text}'
            typography:
              fontFamily: Chirp
              fontStyle: Regular
              lineHeight: 18
          content: Selected value
        chevron-down:
          styles:
            width: 24
            height: 24
          instanceOf: chevron-down
        options-list:
          styles:
            clipsContent: true
            cornerRadius: 12
            width: 300
            layoutMode: VERTICAL
            layoutSizingVertical: HUG
            itemSpacing: 12
            padding:
              top: 15
              bottom: 15
              start: 16
              end: 16
            backgroundColor: '{semantic.color.background.secondary-bg}'
        scrollbar:
          styles:
            clipsContent: true
            cornerRadius: 12
            width: 5
            height: 50
            position: ABSOLUTE
            top: 24
            start: 291
            backgroundColor: '{semantic.color.background.tertiary-bg}'
        chevron-up:
          styles:
            width: 24
            height: 24
          instanceOf: chevron-up
        SelectItem:
          styles:
            layoutSizingHorizontal: FILL
            height: 48
          propConfigurations:
            State: Default
          instanceOf: SelectItem
    variants:
    - configuration:
        State: Hover
      elements:
        trigger:
          styles:
            padding:
              end: 8
            backgroundColor: '{semantic.color.background.tertiary-bg}'
    - configuration:
        State: Open
      layout:
      - root:
        - Label
        - trigger:
          - Selected value
          - chevron-up
        - options-list:
          - SelectItem
          - SelectItem
          - SelectItem
          - SelectItem
          - scrollbar
      elements:
        trigger:
          styles:
            strokes: '{semantic.color.border.primary}'
            strokeAlign: INSIDE
            strokeWeight: 1
            padding:
              end: 8
            backgroundColor: '{semantic.color.background.tertiary-bg}'
    - configuration:
        State: Disabled
      elements:
        trigger:
          styles:
            opacity: 0.5
    invalidPropCombinations: []
    metadata:
      author: Mia
      lastUpdated: 2026-10-27 16:21:00.695000+00:00
      generator:
        url: https://www.figma.com/community/plugin/1549454283615386215/specs-2-formerly-anova
        version: 1.25.0
        name: Spectacular
        license:
          status: none
          level: FREE
      schema:
        url: https://raw.githubusercontent.com/DirectedEdges/spectacular/specs-schema@0.38.0/packages/schema/schema/component.schema.json
        version: 0.38.0
        latest: https://raw.githubusercontent.com/DirectedEdges/spectacular/main/packages/schema/schema/component.schema.json
      source:
        pageId: 416:103
        nodeId: 416:136
        nodeType: COMPONENT_SET
      conventions:
        platforms:
          figma:
            naming: NONE
            slotConstraints: false
            inferNumberProps: false
      settings:
        spec:
          format: YAML
          keys: SAFE
          layout: LAYOUT
          tokens: TOKEN
          color: OBJECT
          variantDepth: 9999
          details: LAYERED
          collapsePrimitiveWrapper: false
          promotePrimitives: false
          roles: false
          roleValidation: warn
          invalidVariants: false
          invalidCombinations: true
          emptyVariants: false
          defaultSlotContent: false
          splitComponents: true
          splitConcerns: true
          useSubfolders: true
