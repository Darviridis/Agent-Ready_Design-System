                components:
                  - 0.6667
                  - 0.8863
                  - 0.7843
                hex: "#AAE2C8"
              strokeAlign: INSIDE
              strokeWeight: 1
              padding:
                end: 8
              backgroundColor:
                colorSpace: srgb
                components:
                  - 0.2078
                  - 0.2588
                  - 0.2471
                hex: "#35423F"
      - configuration:
          State: Disabled
        elements:
          trigger:
            styles:
