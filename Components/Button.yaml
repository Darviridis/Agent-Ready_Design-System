components:
  button:
    title: Button
    anatomy:
      root:
        type: container
      Connect wallet:
        type: text
      loading:
        type: instance
        detectedIn: State=Loading, Variant=Primary, Interaction=Default, Size=lg
        instanceOf: loading
      waiting:
        type: instance
        detectedIn: State=Waiting, Variant=Primary, Interaction=Default, Size=lg
        instanceOf: waiting
      icon:
        type: instance
        detectedIn: State=Default, Variant=Icon, Interaction=Default, Size=lg
        instanceOf: icon
    props:
      State:
        type: string
        default: Default
        enum:
        - Default
        - Disabled
        - Loading
        - Waiting
        nullable: false
      Variant:
        type: string
        default: Primary
        enum:
        - Primary
        - Secondary
        - Icon
        nullable: false
      Interaction:
        type: string
        default: Default
        enum:
        - Default
        - Hover
        nullable: false
      Size:
        type: string
        default: lg
        enum:
        - lg
        - md
        nullable: false
      Instance:
        type: string
        examples:
        - icon
    default:
      layout:
      - root:
        - Connect wallet
      elements:
        root:
          styles:
            cornerRadius: '{semantic.radius.md}'
            width: 200
            mainAxisAlignment: CENTER
            primaryAxisSizingMode: FIXED
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingVertical: HUG
            itemSpacing: '{semantic.spacing.inline.8}'
            padding:
              top: '{primitive.spacing.20}'
              bottom: '{primitive.spacing.20}'
              start: '{primitive.spacing.24}'
              end: '{primitive.spacing.24}'
            backgroundColor: '{component.color.action.tertiary-background}'
        Connect wallet:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.tertiary-text}'
            typography:
              fontSize: '{semantic.typography.body.lg.font-size}'
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Medium
              lineHeight: '{semantic.typography.body.lg.line-height}'
            textAlignHorizontal: CENTER
          content: Connect wallet
        loading:
          styles:
            width: 24
            height: 24
          instanceOf: loading
        waiting:
          styles:
            width: 24
            height: 24
          instanceOf: waiting
        icon:
          styles:
            width: 24
            height: 24
          instanceOf: icon
    variants:
    - configuration:
        Size: md
      elements:
        root:
          styles:
            padding:
              top: '{primitive.spacing.14}'
              bottom: '{primitive.spacing.14}'
    - configuration:
        State: Default
      elements:
        root:
          styles:
            backgroundColor: '{component.color.action.primary-background}'
        Connect wallet:
          styles:
            textColor: '{semantic.color.text.inverse-text}'
    - configuration:
        State: Loading
      layout:
      - root:
        - Connect wallet
        - loading
      elements:
        root:
          styles:
            opacity: 0.5
            padding:
              top: '{primitive.spacing.18}'
              end: '{primitive.spacing.20}'
              bottom: '{primitive.spacing.18}'
            backgroundColor: '{component.color.action.primary-background}'
        Connect wallet:
          styles:
            textColor: '{semantic.color.text.inverse-text}'
    - configuration:
        State: Waiting
      layout:
      - root:
        - waiting
      elements:
        root:
          styles:
            opacity: 0.5
            padding:
              top: '{primitive.spacing.26}'
              end: '{primitive.spacing.20}'
              bottom: '{primitive.spacing.26}'
              start: '{primitive.spacing.20}'
    - configuration:
        State: Default
        Interaction: Hover
      elements:
        root:
          styles:
            backgroundColor: '{component.color.action.primary-background-hover}'
    - configuration:
        State: Default
        Variant: Secondary
      elements:
        root:
          styles:
            backgroundColor: '{component.color.action.secondary-background}'
        Connect wallet:
          styles:
            textColor: '{semantic.color.text.primary-text}'
    - configuration:
        State: Default
        Variant: Icon
      layout:
      - root:
        - icon
      elements:
        root:
          styles:
            width: 60
            height: 60
            layoutSizingVertical: FIXED
            backgroundColor: null
            aspectRatio:
              x: 48
              y: 48
    - configuration:
        State: Loading
        Size: md
      elements:
        root:
          styles:
            padding:
              top: '{primitive.spacing.12}'
              bottom: '{primitive.spacing.12}'
    - configuration:
        State: Loading
        Variant: Secondary
      elements:
        root:
          styles:
            backgroundColor: '{component.color.action.secondary-background}'
        Connect wallet:
          styles:
            textColor: '{semantic.color.text.primary-text}'
    - configuration:
        State: Waiting
        Size: md
      elements:
        root:
          styles:
            padding: '{primitive.spacing.20}'
    - configuration:
        State: Default
        Variant: Secondary
        Interaction: Hover
      elements:
        root:
          styles:
            backgroundColor: '{component.color.action.secondary-background-hover}'
    - configuration:
        State: Default
        Variant: Icon
        Size: md
      elements:
        root:
          styles:
            width: 48
            height: 48
            padding:
              top: '{primitive.spacing.20}'
              bottom: '{primitive.spacing.20}'
            aspectRatio: null
    - configuration:
        State: Disabled
      elements:
        root:
          styles:
            cornerRadius: '{semantic.radius.md}'
            width: 200
            mainAxisAlignment: CENTER
            primaryAxisSizingMode: FIXED
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingVertical: HUG
            itemSpacing: '{semantic.spacing.inline.8}'
            padding:
              top: '{primitive.spacing.20}'
              bottom: '{primitive.spacing.20}'
              start: '{primitive.spacing.24}'
              end: '{primitive.spacing.24}'
            backgroundColor: '{component.color.action.tertiary-background-hover}'
        Connect wallet:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.tertiary-text}'
            typography:
              fontSize: '{semantic.typography.body.lg.font-size}'
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Medium
              lineHeight: '{semantic.typography.body.lg.line-height}'
            textAlignHorizontal: CENTER
    invalidPropCombinations: []
