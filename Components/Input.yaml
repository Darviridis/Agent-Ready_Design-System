components:
  input:
    title: Input
    anatomy:
      root:
        type: container
      Heading:
        type: text
      Frame 1:
        type: container
      Text:
        type: text
      Error text:
        type: text
      Entered text:
        type: text
        detectedIn: State=Filled, Interaction=Default
      Caret:
        type: rectangle
        detectedIn: State=Focus, Interaction=Default
      Please check this value:
        type: text
        detectedIn: State=Warning, Interaction=Default
      Enter a valid value:
        type: text
        detectedIn: State=Error, Interaction=Default
    props:
      State:
        type: string
        default: Default
        enum:
        - Default
        - Filled
        - Disabled
        - Focus
        - Readonly
        - Warning
        - Error
        nullable: false
      Interaction:
        type: string
        default: Default
        enum:
        - Default
        - Hover
        nullable: false
      showErrorText:
        type: boolean
        default: false
    default:
      layout:
      - root:
        - Heading
        - Frame 1:
          - Text
        - Error text
      elements:
        root:
          styles:
            width: 420
            layoutMode: VERTICAL
            layoutSizingVertical: HUG
            itemSpacing: '{semantic.spacing.inline.4}'
        Heading:
          styles:
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.secondary-text}'
            typography:
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Bold
              lineHeight: '{semantic.typography.body.md.line-height}'
          content: Heading
        Frame 1:
          styles:
            clipsContent: true
            cornerRadius: '{semantic.radius.md}'
            primaryAxisSizingMode: FIXED
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            itemSpacing: 10
            padding:
              top: '{primitive.spacing.14}'
              bottom: '{primitive.spacing.14}'
              start: '{primitive.spacing.20}'
              end: '{primitive.spacing.20}'
            backgroundColor: '{component.color.action.tertiary-background}'
        Text:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.tertiary-text}'
            typography:
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.md.line-height}'
          content: Text
        Error text:
          styles:
            visible: false
            width: 55
            height: 16
            textColor: '{semantic.color.text.error-text}'
            typography:
              fontSize: '{semantic.typography.body.xs.font-size}'
              fontFamily: Golos Text
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.sm.line-height}'
          content: Error text
        Entered text:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.primary-text}'
            typography:
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.md.line-height}'
          content: Entered text
        Caret:
          styles:
            width: 1
            height: 18
            position: ABSOLUTE
            top: 14
            start: 20
            backgroundColor: '{component.color.action.primary-background}'
        Please check this value:
          styles:
            visible: false
            width: 139
            height: 16
            textColor: '{semantic.color.warning.warning}'
            typography:
              fontSize: '{semantic.typography.body.xs.font-size}'
              fontFamily: Golos Text
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.sm.line-height}'
          content: Please check this value.
        Enter a valid value:
          styles:
            visible: false
            width: 109
            height: 16
            textColor: '{semantic.color.text.error-text}'
            typography:
              fontSize: '{semantic.typography.body.xs.font-size}'
              fontFamily: Golos Text
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.sm.line-height}'
          content: Enter a valid value.
    variants:
    - configuration:
        Interaction: Hover
      elements:
        Frame 1:
          styles:
            strokes: '{component.color.action.secondary-background-hover}'
            strokeAlign: INSIDE
            strokeWeight: 1
            effects:
              shadows:
              - visible: true
                offsetX: 0
                offsetY: 0
                blur: 4
                spread: 0
                color: '{semantic.color.effect.glow}'
            backgroundColor: '{component.color.action.tertiary-background-hover}'
    - configuration:
        State: Filled
      layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Error text
    - configuration:
        State: Disabled
      elements:
        Heading:
          styles:
            textColor: '{semantic.color.text.tertiary-text}'
        Frame 1:
          styles:
            opacity: 0.5
    - configuration:
        State: Focus
      layout:
      - root:
        - Heading
        - Frame 1:
          - Text
          - Caret
        - Error text
      elements:
        Frame 1:
          styles:
            strokes: '{component.color.action.primary-background}'
            strokeAlign: INSIDE
            strokeWeight: 2
            effects:
              shadows:
              - visible: true
                offsetX: 0
                offsetY: 0
                blur: 4
                spread: 0
                color: '{semantic.color.effect.glow}'
    - configuration:
        State: Readonly
      layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Error text
      elements:
        Frame 1:
          styles:
            strokes: '{component.color.action.tertiary-background-hover}'
            strokeAlign: INSIDE
            strokeWeight: 1
            backgroundColor: '{semantic.color.background.primary-bg}'
    - configuration:
        State: Warning
      layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Please check this value
      elements:
        Frame 1:
          styles:
            strokes: '{semantic.color.warning.warning}'
            strokeAlign: INSIDE
            strokeWeight: 1
            effects:
              shadows:
              - visible: true
                offsetX: 0
                offsetY: 0
                blur: 4
                spread: 3
                color: '{semantic.color.effect.warning-glow}'
    - configuration:
        State: Error
      layout:
      - root:
        - Heading
        - Frame 1:
          - Entered text
        - Enter a valid value
      elements:
        Frame 1:
          styles:
            strokes: '{semantic.color.text.error-text}'
            strokeAlign: INSIDE
            strokeWeight: 1
            effects:
              shadows:
              - visible: true
                offsetX: 0
                offsetY: 0
                blur: 4
                spread: 3
                color: '{semantic.color.effect.error-glow}'
    - configuration:
        State: Filled
        Interaction: Hover
      elements:
        Frame 1:
          styles:
            strokes: '{component.color.action.secondary-background}'
    invalidPropCombinations: []
    metadata:
      author: Mia
      lastUpdated: 2026-10-19 21:25:06.104000+00:00
      generator:
        url: https://www.figma.com/community/plugin/1549454283615386215/specs-2-formerly-anova
        version: 1.22.0
        name: Specs 2
        license:
          status: none
          level: FREE
      schema:
        url: https://raw.githubusercontent.com/DirectedEdges/specs/specs-schema@0.35.0/packages/schema/schema/component.schema.json
        version: 0.35.0
        latest: https://raw.githubusercontent.com/DirectedEdges/specs/main/packages/schema/schema/component.schema.json
      source:
        pageId: 8:5807
        nodeId: 11:61
        nodeType: COMPONENT_SET
      conventions:
        platforms:
          figma:
            naming: NONE
            slotConstraints: false
            inferNumberProps: false
      settings:
        spec:
          format: YAML
          keys: SAFE
          layout: LAYOUT
          tokens: TOKEN
          color: OBJECT
          variantDepth: 9999
          details: LAYERED
          collapsePrimitiveWrapper: false
          promotePrimitives: false
          roles: false
          roleValidation: warn
          invalidVariants: false
          invalidCombinations: true
          emptyVariants: false
          defaultSlotContent: false
          splitComponents: true
          splitConcerns: true
          useSubfolders: true
