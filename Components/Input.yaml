components:
  input:
    title: Input
    anatomy:
      root:
        type: container
      Heading:
        type: text
      Frame 1:
        type: container
      Text:
        type: text
      Error text:
        type: text
      Entered text:
        type: text
        detectedIn: State=Filled
      Caret:
        type: rectangle
        detectedIn: State=Active
      Please check this value:
        type: text
        detectedIn: State=Warning
      Enter a valid value:
        type: text
        detectedIn: State=Error
    props:
      State:
        type: string
        default: Default
        enum:
          - Default
          - Hover
          - Filled
          - Disabled
          - Active
          - Read-only
          - Warning
          - Filled-hover
          - Error
        nullable: false
      Show Error text:
        type: boolean
        default: false
    default:
      layout:
        - root:
            - Heading
            - Frame 1:
                - Text
            - Error text
      elements:
        root:
          styles:
            width: 420
            layoutMode: VERTICAL
            layoutSizingVertical: HUG
            itemSpacing: 4
        Heading:
          styles:
            layoutSizingHorizontal: FILL
            layoutSizingVertical: HUG
            textColor:
