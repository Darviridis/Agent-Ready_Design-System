composition:
root:
semantic_role: label_container
description: Container that defines the tag's shape, padding, background, and border.
direction: horizontal
width_behavior: hug
height_behavior: hug
default_background_color: "#1F2C2A"
default_corner_radius: 4

Native:
semantic_role: tag_label
description: Text label used by the square shape.
default_content: Native
text_color: "#697976"
font_family: Chirp
font_style: Regular
font_size: 12
line_height: 14

Verified:
semantic_role: tag_label
description: Text label used by the oval shape.
default_content: Verified
text_color: "#AAE2C8"
font_family: Chirp
font_style: Regular
font_size: 12
line_height: 14

behavior:

* Size and Shape are independent properties.
* Support all four combinations of Size and Shape.
* The square shape displays Native by default.
* The oval shape displays Verified by default.
* Keep the labels consistent with the actual item data.
* Do not infer that an item is verified from its appearance alone.
* Tags are informational by default and are not interactive controls.
* Keep label content configurable if the component needs to support additional values.

accessibility:

* Ensure each label communicates meaningful information.
* Do not rely on color or shape alone to communicate a status.
* Maintain sufficient text contrast against the background.
* Use a non-interactive semantic element for informational tags.
* If a tag becomes interactive, provide appropriate button or link semantics and keyboard support.
* Avoid making informational tags focusable without a functional reason.

implementation:

* Read this file together with components/tags.yaml.
* Treat the Specs 2 YAML as the source of truth for visual anatomy, colors, typography, borders, padding, and clipping behavior.
* Treat this file as additional semantic and behavioral guidance.
* Keep Size and Shape as independent properties.
* Apply the combination-specific padding when both properties are selected.
* For Size=sm and Shape=oval, use vertical padding of 2 and horizontal padding of 8.
* For Size=md and Shape=oval, use vertical padding of 4 and horizontal padding of 12.
* The sm oval variant clips content; the md oval variant does not.
* Preserve the oval border and corner radius from the visual specification.
* Do not invent additional states or interactions.

