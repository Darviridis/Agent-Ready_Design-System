# Semantic documentation for Tab
# Keep this file separate from the Specs 2 generated visual specification.

component: tab
title: Tab

description: >
  A tab component for switching between interface sections. It supports
  Active and Inactive states, five sizes, and Default and Hover interaction
  states. The intended default configuration is Active + Default + 2xl.
  The base default in Specs 2 is a layered visual specification and must not
  be treated as an independent semantic state. All visual values use design tokens.

purpose:
  - Indicate the currently active section.
  - Provide navigation between related views or content.
  - Maintain consistent tab styling across different sizes and interaction states.

rationale:
  why_this_approach: >
    Tab is a single selectable item, not a full tab list. State (Active /
    Inactive) and Size (2xl → sm) let the same component work in dense
    toolbars and prominent section switchers. Interaction (Default / Hover)
    is documented separately so each visual combination is explicit.
    Specs 2 uses layered variants, so the base default appearance must not
    be used as a substitute for a State + Interaction combination.
  trade_offs:
    - Selection management, keyboard roving tabindex, and panel switching
      belong to a parent Tabs / TabList, not this component.
    - No icon slot in the current visual spec; icon+label tabs would require
      a design extension.
  alternatives:
    - Use Button for actions that do not switch views.
    - Use Link for navigation to a different route when tabs are not in-page.
    - Compose multiple Tab instances inside a dedicated Tabs container for
      accessible tablist behavior.

anatomy:
  root:
    type: container
    description: Container for the tab.
  Tab:
    type: text
    description: Text label displayed inside the tab.

props:
  State:
    type: string
    default: Active
    enum:
      - Inactive
      - Active
    required: true

  Size:
    type: string
    default: 2xl
    enum:
      - 2xl
      - xl
      - lg
      - md
      - sm
    required: true

  Interaction:
    type: string
    default: Default
    enum:
      - Default
      - Hover
    required: true

default_configuration:
  name: Базовый default
  description: >
    The intended default configuration is State=Active, Interaction=Default,
    Size=2xl. This configuration represents an active tab in its normal,
    non-hovered state.
  props:
    State: Active
    Interaction: Default
    Size: 2xl
  styles:
    backgroundColor: "{component.color.action.primary-background}"
    textColor: "{semantic.color.text.inverse-text}"
    padding:
      top: "{primitive.spacing.18}"
      bottom: "{primitive.spacing.18}"
      start: "{primitive.spacing.32}"
      end: "{primitive.spacing.32}"
  implementation_note: >
    The base default in Specs 2 is not equivalent to either the Active or
    Inactive semantic state. Always resolve the explicit State + Interaction
    pair instead of relying on the unqualified base default.

composition:
  canContain:
    - Tab
  required:
    - Tab
  optional: []
  order: >
    Single text child only. The label is the only content of the tab.
  notes: >
    Tab is an atomic navigation control. Prefer a children or label prop
    for the text content. Composition of multiple Tabs into a TabList /
    Tabs container is the responsibility of a higher-level component.

anti_patterns:
  - Do not nest interactive components (buttons, inputs, links) inside Tab.
  - Do not put icons or badges inside Tab unless the design system later
    defines an icon slot.
  - Do not use Tab for actions that change application state without
    navigation; prefer Button.
  - Do not invent additional states beyond Active / Inactive and Default / Hover.
  - Do not rely on the bare Specs 2 default to determine the semantic state.
  - Do not hardcode colors, spacing, or typography; always resolve design tokens.

layout:
  root:
    direction: HORIZONTAL
    layoutSizingHorizontal: HUG
    layoutSizingVertical: HUG
    mainAxisAlignment: CENTER
    crossAxisAlignment: CENTER
    cornerRadius: "{semantic.radius.sm}"
    itemSpacing: 0
    padding:
      top: "{primitive.spacing.18}"
      bottom: "{primitive.spacing.18}"
      start: "{primitive.spacing.32}"
      end: "{primitive.spacing.32}"

variants:
  State:
    Active:
      description: >
        Active tab. Its background and text color depend on Interaction.
      Default:
        backgroundColor: "{component.color.action.primary-background}"
        textColor: "{semantic.color.text.inverse-text}"
      Hover:
        backgroundColor: "{component.color.action.primary-background-hover}"
        textColor: "{semantic.color.text.inverse-text}"

    Inactive:
      description: >
        Inactive tab. Its background and text color depend on Interaction.
      Default:
        backgroundColor: "{component.color.action.tertiary-background}"
        textColor: "{semantic.color.text.secondary-text}"
        itemSpacing: 0
      Hover:
        backgroundColor: "{component.color.action.tertiary-background-hover}"
        textColor: "{semantic.color.text.secondary-text}"
        itemSpacing: 0

  Interaction:
    Default:
      description: >
        Normal, non-hovered appearance. Always combine with an explicit State.
    Hover:
      description: >
        Hover appearance. Always combine with an explicit State.
        Active + Hover uses primary-background-hover.
        Inactive + Hover uses tertiary-background-hover.

  Size:
    2xl:
      description: Базовый размер по умолчанию.
      padding:
        top: "{primitive.spacing.18}"
        bottom: "{primitive.spacing.18}"
        start: "{primitive.spacing.32}"
        end: "{primitive.spacing.32}"
      typography:
        fontSize: "{semantic.typography.body.lg.font-size}"
        lineHeight: "{semantic.typography.body.lg.line-height}"
        fontStyle: Medium

    xl:
      padding:
        top: "{primitive.spacing.14}"
        bottom: "{primitive.spacing.14}"
        start: "{primitive.spacing.24}"
        end: "{primitive.spacing.24}"
      typography:
        fontSize: "{semantic.typography.body.md.font-size}"
        lineHeight: "{semantic.typography.body.md.line-height}"
        fontStyle: Medium

    lg:
      padding:
        top: "{primitive.spacing.12}"
        bottom: "{primitive.spacing.12}"
        start: "{primitive.spacing.16}"
        end: "{primitive.spacing.16}"
      typography:
        fontSize: "{semantic.typography.body.md.font-size}"
        lineHeight: "{semantic.typography.body.md.line-height}"
        fontStyle: Medium

    md:
      padding:
        top: "{primitive.spacing.8}"
        bottom: "{primitive.spacing.8}"
        start: "{primitive.spacing.16}"
        end: "{primitive.spacing.16}"
      typography:
        fontSize: "{semantic.typography.body.sm.font-size}"
        lineHeight: "{semantic.typography.body.sm.line-height}"
        fontStyle: Medium

    sm:
      padding:
        top: 5
        bottom: 5
        start: "{primitive.spacing.16}"
        end: "{primitive.spacing.16}"
      typography:
        fontSize: "{semantic.typography.body.xs.font-size}"
        lineHeight: "{semantic.typography.body.xs.line-height}"
        fontStyle: Medium

behavior:
  - State determines whether the tab is Active or Inactive.
  - Interaction determines whether the tab uses Default or Hover styling.
  - Size determines the tab's padding and typography.
  - The intended default configuration is Active + Default + 2xl.
  - The bare Specs 2 default is not an independent semantic state.
  - Active + Default → primary-background + inverse-text.
  - Active + Hover → primary-background-hover + inverse-text.
  - Inactive + Default → tertiary-background + secondary-text.
  - Inactive + Hover → tertiary-background-hover + secondary-text.
  - Apply explicit State + Interaction combinations when resolving styles.
  - The YAML defines no invalid prop combinations.

implementation:
  - Preserve the exact prop names and enum values from the specification.
  - Always resolve State and Interaction together.
  - For State="Active" and Interaction="Default", use primary-background.
  - For State="Active" and Interaction="Hover", use primary-background-hover.
  - For State="Inactive" and Interaction="Default", use tertiary-background.
  - For State="Inactive" and Interaction="Hover", use tertiary-background-hover.
  - Do not use the bare Specs 2 default as a substitute for an explicit combination.
  - Use Size="2xl" for the intended default configuration.
  - The specification defines visual styling only; it does not specify click behavior,
    selected-state management, keyboard navigation, or content switching.
  - Resolve design tokens at runtime / build time.
  - Prefer a children or label prop for the text content.

design_tokens:
  radius_sm: "{semantic.radius.sm}"
  primary_background: "{component.color.action.primary-background}"
  primary_background_hover: "{component.color.action.primary-background-hover}"
  tertiary_background: "{component.color.action.tertiary-background}"
  tertiary_background_hover: "{component.color.action.tertiary-background-hover}"
  inverse_text: "{semantic.color.text.inverse-text}"
  secondary_text: "{semantic.color.text.secondary-text}"
  primary_text: "{semantic.color.text.primary-text}"
  font_family_primary: "{semantic.typography.font-family.primary}"
  body_lg_font_size: "{semantic.typography.body.lg.font-size}"
  body_lg_line_height: "{semantic.typography.body.lg.line-height}"
  body_md_font_size: "{semantic.typography.body.md.font-size}"
  body_md_line_height: "{semantic.typography.body.md.line-height}"
  body_sm_font_size: "{semantic.typography.body.sm.font-size}"
  body_sm_line_height: "{semantic.typography.body.sm.line-height}"
  body_xs_font_size: "{semantic.typography.body.xs.font-size}"
  body_xs_line_height: "{semantic.typography.body.xs.line-height}"
  spacing_18: "{primitive.spacing.18}"
  spacing_32: "{primitive.spacing.32}"
  spacing_14: "{primitive.spacing.14}"
  spacing_24: "{primitive.spacing.24}"
  spacing_12: "{primitive.spacing.12}"
  spacing_16: "{primitive.spacing.16}"
  spacing_8: "{primitive.spacing.8}"
