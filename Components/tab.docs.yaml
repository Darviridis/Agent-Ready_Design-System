component: tab
title: Tab

description: >
A reusable tab component with five sizes, two selection states, and two
interaction appearances. It is intended to be used as part of a tab group
that allows users to switch between related views or content panels.

purpose:

* Indicate which tab is currently selected.
* Allow users to switch between related views or sections.
* Provide consistent tab styling across different interface sizes.

usage:
use_when:
- The user needs to switch between related views within the same context.
- A tab is part of a group of tabs.
- The interface needs to distinguish the selected tab from unselected tabs.
avoid_when:
- The element navigates to a separate page and should be a standard link.
- The element performs an action unrelated to switching tabs.
- The element is used as a standalone button without a tab context.

props:
State:
type: string
description: Indicates whether the tab is selected.
default: Active
enum:
- Active
- Non-active
required: true

Size:
type: string
description: Controls the tab's typography and padding.
default: 2XL
enum:
- 2XL
- XL
- L
- M
- S
required: true

Interaction:
type: string
description: Controls the visual appearance when the pointer is or is not hovering over the tab.
default: Default
enum:
- Default
- Hover
required: true

