composition:
root:
semantic_role: tab
description: Container that defines the tab's background, spacing, padding, and shape.
direction: horizontal
main_axis_alignment: center
cross_axis_alignment: center
width_behavior: hug
height_behavior: hug
corner_radius: 8
item_spacing: 10
Tab:
semantic_role: tab_label
description: Visible text label of the tab.
default_content: Tab
font_family: Chirp
font_style: Medium

behavior:

* State, Size, and Interaction are independent properties.
* Support all combinations of State, Size, and Interaction unless the product design defines restrictions.
* Active indicates the currently selected tab.
* Non-active indicates a tab that is available but not selected.
* Interaction changes the visual appearance without changing the selected state.
* Keep the tab label configurable rather than hardcoding the word Tab.
* Selecting a tab must update the selected state of the tab group.
* A tab group should normally have one selected tab at a time.
* Switching tabs must display the corresponding content panel.
* Do not use the visual State property as a substitute for application selection logic.
* Hover must not be the only indication that the element is interactive.

accessibility:

* Use semantic tab markup when the component switches between tab panels.
* Implement appropriate tablist, tab, and tabpanel relationships.
* Expose the selected state using aria-selected when implementing the ARIA tabs pattern.
* Give each tab an accessible name based on its visible label.
* Support keyboard navigation and activation according to the chosen tab pattern.
* Provide a visible keyboard focus indicator distinct from the hover appearance.
* Ensure text and focus indicators have sufficient contrast.
* Do not communicate selection through color alone.
* Keep keyboard focus behavior consistent when switching between tabs.
* If the component is not used as part of a tab interface, use semantics appropriate to its actual purpose.

implementation:

* Read this file together with components/tab.yaml.
* Treat the Specs 2 YAML as the source of truth for visual anatomy, colors, typography, padding, and variants.
* Treat this file as additional semantic, behavioral, and accessibility guidance.
* Implement tab selection in application logic.
* Keep State, Size, and Interaction as independent properties.
* Apply typography and padding from the selected Size.
* Apply colors from the selected State and Interaction combination.
* Implement keyboard focus separately because the visual specification does not define a dedicated focus state.
* Preserve the selected state when the pointer enters or leaves the tab.
* Do not invent disabled, loading, or error states unless they are defined elsewhere in the design system.

