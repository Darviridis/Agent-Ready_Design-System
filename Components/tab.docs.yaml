# Tab

## Description

A tab component for switching between interface sections. It supports Active and Inactive states, five sizes, and Default and Hover interaction states.

## Purpose

* Indicate the currently active section.
* Provide navigation between related views or content.
* Maintain consistent tab styling across different sizes and interaction states.

## Anatomy

* `root` — container for the tab.
* `Tab` — text label displayed inside the tab.

## Props

| Prop          | Type   | Default   | Values                        |
| ------------- | ------ | --------- | ----------------------------- |
| `State`       | string | `Active`  | `Inactive`, `Active`          |
| `Size`        | string | `2xl`     | `2xl`, `xl`, `lg`, `md`, `sm` |
| `Interaction` | string | `Default` | `Default`, `Hover`            |

All props are non-nullable.

## Layout

* Root layout: horizontal.
* Horizontal and vertical sizing: Hug.
* Content alignment: centered on both axes.
* Default corner radius: `8px`.
* Default item spacing: `10px`.
* Default padding: `18px` top and bottom, `32px` left and right.

## Variants and styles

### State: Active

Default background: `#576762`.

Text color: `#E8F4F0`.

Typography: Chirp Medium, `18px` font size, `20px` line height.

### State: Inactive

Background: `#35423F`.

Text color: `#C2D4CD`.

Item spacing: `0px`.

### Interaction: Hover

For the Active state:

* Background: `#D5FFF5`.
* Text color: `#171818`.

For the Inactive state:

* Background: `#738F82`.
* Text color: `#171818`.

### Size: 2xl

* Padding: `18px` top and bottom, `32px` left and right.
* Font size: `18px`.
* Line height: `20px`.

### Size: xl

* Padding: `14px` top and bottom, `24px` left and right.
* Font size: `16px`.
* Line height: `18px`.

### Size: lg

* Padding: `12px` top and bottom, `16px` left and right.
* Font size: `16px`.
* Line height: `18px`.

### Size: md

* Padding: `8px` top and bottom, `16px` left and right.
* Font size: `14px`.
* Line height: `16px`.

### Size: sm

* Padding: `5px` top and bottom, `16px` left and right.
* Font size: `12px`.
* Line height: `14px`.

All sizes use Chirp Medium.

## Behavior

* `State` controls whether the tab is Active or Inactive.
* `Interaction` controls whether the tab uses Default or Hover styling.
* `Size` controls the tab's padding and typography.
* The YAML defines no invalid prop combinations.

## Implementation notes

* Preserve the exact prop names and enum values from the specification.
* Apply the Inactive + Hover styles when `State="Inactive"` and `Interaction="Hover"`.
* Apply the Active + Hover styles when `State="Active"` and `Interaction="Hover"`.
* The specification defines visual styling only; it does not specify click behavior, selected-state management, keyboard navigation, or content switching.
* Do not infer additional states or styles that are not defined in the YAML.
