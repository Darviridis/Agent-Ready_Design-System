# Semantic documentation for Link
# Keep this file separate from the Specs 2 generated visual specification.

component: link
title: Link

description: >
  A reusable text link component with three sizes and two visual states.
  It provides a consistent underlined appearance for navigation throughout
  the interface. Visual values use design tokens.

purpose:
  - Navigate users to pages, sections, or external resources.
  - Maintain consistent link styling across the product.
  - Support different text sizes for different interface contexts.

usage:
  use_when:
    - Users need to navigate to another page or resource.
    - A text link appears within a form, content section, or informational area.
    - The interface requires a consistent underlined link style.
  avoid_when:
    - The action changes application state rather than navigating; use a button.
    - The element submits a form; use a button.
    - The element is decorative and not interactive.

props:
  State:
    type: string
    description: Controls the visual state of the link.
    default: Default
    enum:
      - Default
      - Hover
    required: true

  Size:
    type: string
    description: Controls the text size and line height of the link.
    default: sm
    enum:
      - sm
      - md
      - lg
    required: true

composition:
  canContain:
    - Link   # text content
  required:
    - Link
  optional: []
  order: >
    Single text child only. The link text is the only content.
  notes: >
    Prefer a children prop for the link text and an href prop for the
    destination. Do not accept nested interactive elements.

anti_patterns:
  - Do not use Link for actions that change application state; use Button.
  - Do not use Link to submit a form; use Button type="submit".
  - Do not nest interactive components (buttons, inputs) inside Link.
  - Do not remove the underline; it distinguishes links from surrounding text.
  - Do not invent visited / disabled / active states unless defined by the design system.
  - Do not hardcode colors or typography; always resolve design tokens.

variants:
  State:
    Default:
      description: Normal link appearance.
      textColor: "{component.color.action.primary-background}"
    Hover:
      description: Link appearance when the pointer hovers over it.
      textColor: "{component.color.action.primary-background-hover}"

  Size:
    sm:
      description: Small link.
      font_family: "{semantic.typography.font-family.primary}"
      font_style: Medium
      font_size: "{semantic.typography.body.xs.font-size}"
      line_height: "{semantic.typography.body.xs.line-height}"
      textDecoration: UNDERLINE

    md:
      description: Medium link.
      font_family: "{semantic.typography.font-family.primary}"
      font_style: Medium
      font_size: "{semantic.typography.body.sm.font-size}"
      line_height: "{semantic.typography.body.sm.line-height}"
      textDecoration: UNDERLINE

    lg:
      description: Large link.
      font_family: "{semantic.typography.font-family.primary}"
      font_style: Medium
      font_size: "{semantic.typography.body.md.font-size}"
      line_height: "{semantic.typography.body.md.line-height}"
      textDecoration: UNDERLINE

anatomy:
  root:
    semantic_role: link_container
    direction: HORIZONTAL
    mainAxisAlignment: CENTER
    crossAxisAlignment: CENTER
    layoutSizingHorizontal: HUG
    layoutSizingVertical: HUG
    itemSpacing: 10

  Link:
    semantic_role: anchor
    description: Visible text of the link.
    default_content: Link
    textDecoration: UNDERLINE
    default_color: "{component.color.action.primary-background}"
    font_family: "{semantic.typography.font-family.primary}"
    font_style: Medium

behavior:
  - Use State to select the visual state and Size to select the typography size.
  - State and Size are independent properties and must work in combination.
  - Default uses primary-background color.
  - Hover uses primary-background-hover color.
  - sm uses body.xs typography.
  - md uses body.sm typography.
  - lg uses body.md typography.
  - Keep the link text configurable rather than hardcoding the word Link.
  - The consuming interface must provide the destination URL.
  - Do not treat the visual State property as a replacement for actual pointer or keyboard interaction.
  - Hover styling must not be the only indication that the element is interactive.

accessibility:
  - Use a semantic anchor element with a valid href for navigation.
  - Provide descriptive link text that communicates the destination or purpose.
  - Support keyboard navigation and activation.
  - Provide a visible keyboard focus indicator distinct from the hover appearance.
  - Maintain sufficient text and focus-indicator contrast.
  - Preserve the underline to distinguish links from surrounding text.
  - Do not use a link for an action that should be represented by a button.
  - Communicate unexpected new-tab behavior when applicable.

implementation:
  - Read this file together with components/link.yaml.
  - Treat the Specs 2 YAML as the source of truth for visual anatomy, typography, colors, and variants.
  - Treat this file as additional semantic and behavioral guidance.
  - Implement navigation using a semantic anchor with a valid destination.
  - Keep State and Size as independent properties.
  - Support all six combinations of State and Size.
  - Apply the typography values defined for the selected Size.
  - Apply the color defined for the selected State.
  - Add keyboard focus styling according to the broader design system.
  - Do not invent visited, disabled, or active states unless they are defined by the design system.
  - Resolve design tokens at runtime / build time.

related_components:
  - Button

design_tokens:
  link_default: "{component.color.action.primary-background}"
  link_hover: "{component.color.action.primary-background-hover}"
  link_font_family: "{semantic.typography.font-family.primary}"
  link_font_style: Medium
  link_size_sm: "{semantic.typography.body.xs.font-size}"
  link_line_height_sm: "{semantic.typography.body.xs.line-height}"
  link_size_md: "{semantic.typography.body.sm.font-size}"
  link_line_height_md: "{semantic.typography.body.sm.line-height}"
  link_size_lg: "{semantic.typography.body.md.font-size}"
  link_line_height_lg: "{semantic.typography.body.md.line-height}"
  link_text_decoration: UNDERLINE
