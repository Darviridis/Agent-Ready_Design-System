component: checkbox

description: >
A checkbox is an interactive control that allows users to select or
deselect an option. Unlike a radio button, a checkbox does not restrict
the user to selecting only one option in a group.

purpose:

* Allow users to toggle an option on or off.
* Support independent selections in forms and settings.
* Communicate whether an option is selected, unavailable, or interactive.

usage:
use_when:
- Users can select or deselect an option independently.
- A form allows multiple options to be selected.
- Users need to enable or disable a setting.
avoid_when:
- Exactly one option must be selected from a group; use a radio button.
- An action must be triggered immediately without representing a persistent selection; consider a button.

props:
State:
type: string
description: >
Describes the visual state represented by the source Figma component.
In a running application, checked, disabled, and hover should be
controlled by actual component state and interaction.
default: Default
enum:
- Default
- Hover
- Active
- Active-disabled
- Active-hover
- Disabled
required: true

states:
Default:
checked: false
disabled: false
description: Unchecked checkbox in its normal state.
appearance:
background: "#1F2C2A"
border: "#35423F"

Hover:
checked: false
disabled: false
description: Unchecked checkbox when the pointer hovers over it.
appearance:
background: "#35423F"
border: "#AAE2C8"

Active:
checked: true
disabled: false
description: Selected checkbox in its normal state.
appearance:
background: "#AAE2C8"
check_icon_visible: true

Active-disabled:
checked: true
disabled: true
description: Selected checkbox that cannot currently be changed.
appearance:
background: "#AAE2C8"
opacity: 0.5
check_icon_visible: true

Active-hover:
checked: true
disabled: false
description: Selected checkbox when the pointer hovers over it.
appearance:
background: "#D5FFF5"
glow_color: "#9DFFE8"
glow_blur: 4
check_icon_visible: true

Disabled:
checked: false
disabled: true
description: Unchecked checkbox that cannot currently be changed.
appearance:
background: null
border: "#35423F"

behavior:

* Clicking or tapping an enabled checkbox toggles its checked value.
* The checked value must be stored in application state, not inferred only from the visual variant.
* A disabled checkbox cannot be toggled by pointer, touch, or keyboard interaction.
* Hover appearance applies only when the control is enabled and the input method supports hover.
* Active-disabled represents a checked and disabled checkbox.
* Active-hover represents a checked checkbox in its hover state.
* The check icon is visible in selected states.
* The visual State property from Figma must not be used as the only source of runtime interaction state.

composition:
root:
semantic_role: checkbox
description: The interactive checkbox container.
dimensions:
width: 24
height: 24
corner_radius: 8
border_width: 1
check:
component: check
description: Checkmark displayed when the checkbox is selected.
visibility_rule: Visible when checked.

accessibility:

* Implement the control using a native input type="checkbox" or an equivalent accessible checkbox pattern.
* Provide an accessible name through an associated label or aria-label.
* Expose the checked and disabled states to assistive technologies.
* Support keyboard interaction; Space should toggle an enabled checkbox.
* Preserve a visible keyboard focus indicator.
* Do not communicate selection or disabled status through color alone.
* If the checkbox controls a setting, associate it with a clear descriptive label.
* Ensure the interactive hit area is large enough for the product's accessibility requirements; the 24x24 visual box does not necessarily define the entire hit area.

implementation:

* Read this file together with components/checkbox.yaml.
* Treat the Specs 2 YAML as the source of truth for visual anatomy, dimensions, colors, effects, and variant definitions.
* Treat this file as additional guidance for semantics, behavior, and accessibility.
* Reuse the existing check component rather than drawing a duplicate checkmark.
* Use the checked value to determine whether the check icon is displayed.
* Use the disabled value to prevent interaction and expose the correct accessibility state.
* Keep hover and focus states distinct.
* Preserve the selected state when a checkbox becomes disabled.
* Do not implement an indeterminate state unless it is added to the design specification and product requirements.

related_components:

* check
* radiobutton

design_tokens:
checkbox_background_default: "#1F2C2A"
checkbox_border_default: "#35423F"
checkbox_border_hover: "#AAE2C8"
checkbox_background_checked: "#AAE2C8"
checkbox_background_checked_hover: "#D5FFF5"
checkbox_glow_checked_hover: "#9DFFE8"
checkbox_corner_radius: 8
checkbox_size: 24
