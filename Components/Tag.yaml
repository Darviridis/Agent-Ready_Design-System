components:
  tag:
    title: Tag
    anatomy:
      root:
        type: container
      Native:
        type: text
      Verified:
        type: text
        detectedIn: Size=sm, Shape=oval
    props:
      Size:
        type: string
        default: sm
        enum:
        - sm
        - md
        nullable: false
      Shape:
        type: string
        default: square
        enum:
        - oval
        - square
        nullable: false
    default:
      layout:
      - root:
        - Native
      elements:
        root:
          styles:
            cornerRadius: '{semantic.radius.xs}'
            mainAxisAlignment: CENTER
            crossAxisAlignment: CENTER
            layoutMode: HORIZONTAL
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            itemSpacing: 10
            padding:
              top: '{primitive.spacing.4}'
              bottom: '{primitive.spacing.4}'
              start: '{primitive.spacing.8}'
              end: '{primitive.spacing.8}'
            backgroundColor: '{component.color.action.tertiary-background}'
        Native:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{semantic.color.text.secondary-text}'
            typography:
              fontSize: '{semantic.typography.body.xs.font-size}'
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.xs.line-height}'
            textAlignHorizontal: END
          content: Native
        Verified:
          styles:
            layoutSizingHorizontal: HUG
            layoutSizingVertical: HUG
            textColor: '{component.color.action.primary-background}'
            typography:
              fontSize: '{semantic.typography.body.xs.font-size}'
              fontFamily: '{semantic.typography.font-family.primary}'
              fontStyle: Regular
              lineHeight: '{semantic.typography.body.xs.line-height}'
          content: Verified
    variants:
    - configuration:
        Shape: oval
      layout:
      - root:
        - Verified
      elements:
        root:
          styles:
            clipsContent: true
            cornerRadius: '{semantic.radius.full}'
            mainAxisAlignment: START
            crossAxisAlignment: START
            layoutMode: VERTICAL
            strokes: '{component.color.action.secondary-background}'
            strokeAlign: INSIDE
            strokeWeight: 0.8
            itemSpacing: 0
            padding:
              top: 2
              bottom: 2
    - configuration:
        Size: md
      elements:
        root:
          styles:
            padding:
              top: 6
              end: '{primitive.spacing.12}'
              bottom: 6
              start: '{primitive.spacing.12}'
    - configuration:
        Size: md
        Shape: oval
      elements:
        root:
          styles:
            clipsContent: false
            padding:
              top: '{primitive.spacing.4}'
              bottom: '{primitive.spacing.4}'
    invalidPropCombinations: []
    metadata:
      author: Mia
      lastUpdated: 2026-10-19 21:30:57.921000+00:00
      generator:
        url: https://www.figma.com/community/plugin/1549454283615386215/specs-2-formerly-anova
        version: 1.22.0
        name: Specs 2
        license:
          status: none
          level: FREE
      schema:
        url: https://raw.githubusercontent.com/DirectedEdges/specs/specs-schema@0.35.0/packages/schema/schema/component.schema.json
        version: 0.35.0
        latest: https://raw.githubusercontent.com/DirectedEdges/specs/main/packages/schema/schema/component.schema.json
      source:
        pageId: 145:12598
        nodeId: 150:12613
        nodeType: COMPONENT_SET
      conventions:
        platforms:
          figma:
            naming: NONE
            slotConstraints: false
            inferNumberProps: false
      settings:
        spec:
          format: YAML
          keys: SAFE
          layout: LAYOUT
          tokens: TOKEN
          color: OBJECT
          variantDepth: 9999
          details: LAYERED
          collapsePrimitiveWrapper: false
          promotePrimitives: false
          roles: false
          roleValidation: warn
          invalidVariants: false
          invalidCombinations: true
          emptyVariants: false
          defaultSlotContent: false
          splitComponents: true
          splitConcerns: true
          useSubfolders: true
